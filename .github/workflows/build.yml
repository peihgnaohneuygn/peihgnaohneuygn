name: Build Vlad Tool Debug
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          $THEOS/bin/update-theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Tải SDK
        run: |
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/iPhoneOS14.5.sdk $THEOS/sdks/

      - name: Setup Tools (ldid & dpkg)
        run: |
          brew install ldid dpkg

      - name: Tạo Build Files
        run: |
          cat << 'EOF' > Makefile
          ARCHS = arm64 arm64e
          TARGET = iphone:clang:latest:14.0
          include $(THEOS)/makefiles/common.mk
          LIBRARY_NAME = VladAuto
          VladAuto_FILES = Tweak.mm
          VladAuto_FRAMEWORKS = UIKit Foundation
          VladAuto_CFLAGS = -fobjc-arc -Wno-everything -std=c++17
          VladAuto_CCFLAGS = -std=c++17
          include $(THEOS_MAKE_PATH)/library.mk
          EOF

          cat << 'TWEAKEOF' > Tweak.mm
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>

          static UIWindow *gOverlayWindow = nil;

          @interface VSPassthroughWindow : UIWindow
          @end
          @implementation VSPassthroughWindow
          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              UIView *hitView = [super hitTest:point withEvent:event];
              if (hitView == self || hitView == self.rootViewController.view) return nil;
              return hitView;
          }
          @end

          // ==========================================
          // HÀM QUÉT TOÀN BỘ CLASS & HÀM CỦA APP
          // ==========================================
          static void ScanCurrentScreen() {
              UIWindow *keyWin = [UIApplication sharedApplication].keyWindow;
              UIViewController *topVC = keyWin.rootViewController;
              while (topVC.presentedViewController) {
                  topVC = topVC.presentedViewController;
              }
              
              NSMutableString *log = [NSMutableString stringWithString:@"=== CLASS ĐANG MỞ ===\n"];
              [log appendFormat:@"%@\n\n", NSStringFromClass([topVC class])];
              
              [log appendString:@"--- CÁC HÀM CỦA MÀN HÌNH NÀY ---\n"];
              unsigned int count;
              Method *methods = class_copyMethodList([topVC class], &count);
              for (int i = 0; i < count; i++) {
                  [log appendFormat:@"- %s\n", sel_getName(method_getName(methods[i]))];
              }
              free(methods);
              
              [log appendString:@"\n--- CÁC CLASS VIDEO STAR ĐANG TẢI ---\n"];
              int numClasses = objc_getClassList(NULL, 0);
              Class *classes = (__unsafe_unretained Class *)malloc(sizeof(Class) * numClasses);
              numClasses = objc_getClassList(classes, numClasses);
              for (int i = 0; i < numClasses; i++) {
                  NSString *clsName = NSStringFromClass(classes[i]);
                  if ([clsName hasPrefix:@"VS"] || [clsName containsString:@"Editor"] || [clsName containsString:@"Layer"] || [clsName containsString:@"Split"]) {
                      [log appendFormat:@"%@\n", clsName];
                  }
              }
              free(classes);
              
              // Hiển thị bảng cho mày copy
              UIViewController *textVC = [[UIViewController alloc] init];
              textVC.view.backgroundColor = [UIColor blackColor];
              
              UITextView *tv = [[UITextView alloc] initWithFrame:textVC.view.bounds];
              tv.text = log;
              tv.textColor = [UIColor greenColor];
              tv.backgroundColor = [UIColor blackColor];
              tv.font = [UIFont fontWithName:@"Courier" size:12];
              tv.editable = NO;
              [textVC.view addSubview:tv];
              
              UIButton *closeBtn = [UIButton buttonWithType:UIButtonTypeCustom];
              closeBtn.frame = CGRectMake(20, 50, 80, 40);
              [closeBtn setTitle:@"ĐÓNG" forState:UIControlStateNormal];
              [closeBtn setTitleColor:[UIColor redColor] forState:UIControlStateNormal];
              [closeBtn addTarget:textVC action:@selector(dismissViewControllerAnimated:completion:) forControlEvents:UIControlEventTouchUpInside];
              [textVC.view addSubview:closeBtn];
              
              [topVC presentViewController:textVC animated:YES completion:nil];
          }

          __attribute__((constructor))
          static void initVlad() {
              @autoreleasepool {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      if (!gOverlayWindow) {
                          gOverlayWindow = [[VSPassthroughWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                          gOverlayWindow.windowLevel = UIWindowLevelAlert + 10;
                          gOverlayWindow.backgroundColor = [UIColor clearColor];
                          gOverlayWindow.rootViewController = [[UIViewController alloc] init];
                          gOverlayWindow.rootViewController.view.backgroundColor = [UIColor clearColor];
                          gOverlayWindow.hidden = NO;
                          
                          // Nút Quét
                          UIButton *btn = [UIButton buttonWithType:UIButtonTypeCustom];
                          btn.frame = CGRectMake(20, 100, 80, 80);
                          btn.backgroundColor = [UIColor redColor];
                          btn.layer.cornerRadius = 40;
                          btn.layer.borderWidth = 2.0;
                          btn.layer.borderColor = [UIColor whiteColor].CGColor;
                          [btn setTitle:@"QUÉT" forState:UIControlStateNormal];
                          [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                          btn.titleLabel.font = [UIFont boldSystemFontOfSize:16];
                          [btn addTarget:gOverlayWindow.rootViewController action:NSSelectorFromString(@"dummy") forControlEvents:UIControlEventTouchUpInside];
                          
                          // Gắn action bằng block để không cần tạo class
                          [btn addAction:[UIAction actionWithHandler:^(__kindof UIAction * _Nonnull action) {
                              ScanCurrentScreen();
                          }] forControlEvents:UIControlEventTouchUpInside];
                          
                          [gOverlayWindow.rootViewController.view addSubview:btn];
                      }
                  });
              }
          }
          TWEAKEOF

      - name: Build
        run: |
          set -o pipefail
          make clean || true
          make -j1 VERBOSE=1 2>&1 | tee build.log
          DYLIB_PATH=$(find .theos/obj -name "VladAuto.dylib" -type f | head -n 1)
          mkdir -p output
          cp "$DYLIB_PATH" output/vlad_debug.dylib
          install_name_tool -id "@rpath/vlad_debug.dylib" output/vlad_debug.dylib
          ldid -S output/vlad_debug.dylib

      - name: Upload Vlad Dylib
        uses: actions/upload-artifact@v4
        with:
          name: vlad_debug
          path: output/vlad_debug.dylib
          if-no-files-found: error
