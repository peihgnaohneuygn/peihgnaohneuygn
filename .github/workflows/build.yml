name: Build Vlad Tool Final
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          $THEOS/bin/update-theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Tải SDK
        run: |
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/iPhoneOS14.5.sdk $THEOS/sdks/

      - name: Setup Tools (ldid & dpkg)
        run: |
          brew install ldid dpkg

      - name: Tạo Build Files
        run: |
          cat << 'EOF' > Makefile
          ARCHS = arm64 arm64e
          TARGET = iphone:clang:latest:14.0
          include $(THEOS)/makefiles/common.mk
          LIBRARY_NAME = VladAuto
          VladAuto_FILES = Tweak.mm
          VladAuto_FRAMEWORKS = UIKit Foundation AVFoundation Photos PhotosUI QuartzCore CoreMedia AudioToolbox UniformTypeIdentifiers
          VladAuto_CFLAGS = -fobjc-arc -Wno-everything -std=c++17
          VladAuto_CCFLAGS = -std=c++17
          include $(THEOS_MAKE_PATH)/library.mk
          EOF

          cat << 'TWEAKEOF' > Tweak.mm
          #import <UIKit/UIKit.h>
          #import <AVFoundation/AVFoundation.h>
          #import <Photos/Photos.h>
          #import <PhotosUI/PhotosUI.h>
          #import <QuartzCore/QuartzCore.h>
          #import <objc/runtime.h>
          #import <objc/message.h>
          #import <CoreMedia/CoreMedia.h>
          #import <AudioToolbox/AudioToolbox.h>
          #import <UniformTypeIdentifiers/UniformTypeIdentifiers.h>

          @interface QRCodeManager : NSObject
          + (id)sharedInstance;
          - (void)selectedCode:(id)arg1 withImageData:(NSData *)arg2;
          @end

          @interface ProjectManager : NSObject
          + (id)sharedInstance;
          - (id)activeEditProject;
          @end

          static UIImage *gLastQRImage = nil;
          static UIWindow *gOverlayWindow = nil;
          static UIViewController *gCurrentEditor = nil;
          static UIViewController *gCurrentSplitVC = nil;
          static NSURL *gCurrentAudioURL = nil;
          static AVPlayer *gCurrentPlayer = nil;
          static NSArray<NSNumber *> *gDetectedBeats = nil;
          static double gDetectedBPM = 0;
          static id gTimeObserver = nil;
          static BOOL gIsAutoFillMode = NO;

          @interface VSPassthroughWindow : UIWindow
          @end
          @implementation VSPassthroughWindow
          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              UIView *hitView = [super hitTest:point withEvent:event];
              if (hitView == self || hitView == self.rootViewController.view) return nil;
              return hitView;
          }
          @end

          @interface VladUI : NSObject
          + (UIColor *)neonGreen;
          + (UIImage *)icon:(NSString *)name size:(CGFloat)size color:(UIColor *)color;
          @end

          @implementation VladUI
          + (UIColor *)neonGreen { return [UIColor colorWithRed:0.1 green:1.0 blue:0.2 alpha:1.0]; }
          + (UIImage *)icon:(NSString *)name size:(CGFloat)size color:(UIColor *)color {
              if (@available(iOS 13.0, *)) {
                  UIImage *img = [UIImage systemImageNamed:name];
                  UIImageSymbolConfiguration *config = [UIImageSymbolConfiguration configurationWithPointSize:size weight:UIImageSymbolWeightBold];
                  return [[img imageWithConfiguration:config] imageWithTintColor:color renderingMode:UIImageRenderingModeAlwaysOriginal];
              }
              return nil;
          }
          @end

          @interface BeatDetector : NSObject
          + (void)analyzeURL:(NSURL *)url completion:(void(^)(double bpm, NSArray<NSNumber *> *beats, NSError *error))completion;
          @end

          @implementation BeatDetector
          + (void)analyzeURL:(NSURL *)url completion:(void(^)(double bpm, NSArray<NSNumber *> *beats, NSError *error))completion {
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  NSError *err = nil; NSArray *beats = nil; double bpm = 0;
                  @try {
                      AVURLAsset *asset = [AVURLAsset URLAssetWithURL:url options:nil];
                      AVAssetTrack *track = [asset tracksWithMediaType:AVMediaTypeAudio].firstObject;
                      if (!track) { err = [NSError errorWithDomain:@"Vlad" code:1 userInfo:@{NSLocalizedDescriptionKey:@"Không có âm thanh"}]; }
                      else {
                          AVAssetReader *reader = [AVAssetReader assetReaderWithAsset:asset error:&err];
                          if (reader) {
                              NSDictionary *settings = @{AVFormatIDKey: @(kAudioFormatLinearPCM), AVLinearPCMBitDepthKey: @16, AVLinearPCMIsFloatKey: @NO, AVLinearPCMIsBigEndianKey: @NO, AVLinearPCMIsNonInterleaved: @NO, AVSampleRateKey: @22050, AVNumberOfChannelsKey: @1};
                              AVAssetReaderTrackOutput *out = [[AVAssetReaderTrackOutput alloc] initWithTrack:track outputSettings:settings];
                              out.alwaysCopiesSampleData = NO; [reader addOutput:out]; [reader startReading];
                              NSMutableData *allPCM = [NSMutableData data];
                              CMSampleBufferRef sample;
                              while ((sample = [out copyNextSampleBuffer])) {
                                  CMBlockBufferRef block = CMSampleBufferGetDataBuffer(sample);
                                  if (block) {
                                      size_t len = CMBlockBufferGetDataLength(block);
                                      int16_t *buf = (int16_t *)malloc(len);
                                      CMBlockBufferCopyDataBytes(block, 0, len, buf);
                                      [allPCM appendBytes:buf length:len]; free(buf);
                                  }
                                  CFRelease(sample);
                              }
                              [reader cancelReading];
                              NSInteger sampleCount = allPCM.length / sizeof(int16_t);
                              int16_t *samples = (int16_t *)allPCM.bytes;
                              const int hop = 512; NSInteger frames = sampleCount / hop;
                              if (frames < 16) { err = [NSError errorWithDomain:@"Vlad" code:2 userInfo:@{NSLocalizedDescriptionKey:@"Audio ngắn"}]; }
                              else {
                                  double *energy = (double *)malloc(frames * sizeof(double));
                                  for (NSInteger i = 0; i < frames; i++) {
                                      double e = 0;
                                      for (int j = 0; j < hop; j++) { double s = samples[i*hop + j] / 32768.0; e += s * s; }
                                      energy[i] = e / hop;
                                  }
                                  double *onset = (double *)malloc(frames * sizeof(double));
                                  for (NSInteger i = 0; i < frames; i++) {
                                      double prev = (i > 0) ? energy[i-1] : energy[0];
                                      double v = energy[i] - prev; onset[i] = (v > 0) ? v : 0;
                                  }
                                  NSInteger searchMin = 14, searchMax = 86;
                                  if (searchMax >= frames) searchMax = frames - 1;
                                  NSInteger bestLag = 0; double bestScore = 0;
                                  for (NSInteger lag = searchMin; lag < searchMax; lag++) {
                                      double sum = 0;
                                      for (NSInteger i = 0; i < frames - lag; i++) { sum += onset[i] * onset[i+lag]; }
                                      sum /= (frames - lag);
                                      if (lag >= 16 && lag <= 32) sum *= 1.2;
                                      if (sum > bestScore) { bestScore = sum; bestLag = lag; }
                                  }
                                  if (bestLag > 0) {
                                      double fps = 22050.0 / hop;
                                      bpm = 60.0 / (bestLag / fps);
                                      double threshold = 0;
                                      for (NSInteger i = 0; i < frames; i++) threshold += onset[i];
                                      threshold /= frames; threshold *= 1.4;
                                      NSMutableArray *list = [NSMutableArray array];
                                      for (NSInteger i = 1; i < frames - 1; i++) {
                                          if (onset[i] > threshold && onset[i] > onset[i-1] && onset[i] >= onset[i+1]) {
                                              [list addObject:@((double)i * hop / 22050.0)];
                                          }
                                      }
                                      beats = list;
                                      if (list.count == 0) err = [NSError errorWithDomain:@"Vlad" code:3 userInfo:@{NSLocalizedDescriptionKey:@"Không thấy nhịp"}];
                                  } else { err = [NSError errorWithDomain:@"Vlad" code:4 userInfo:@{NSLocalizedDescriptionKey:@"Không tìm được tempo"}]; }
                                  free(energy); free(onset);
                              }
                          }
                      }
                  } @catch (NSException *e) { err = [NSError errorWithDomain:@"Vlad" code:99 userInfo:@{NSLocalizedDescriptionKey: e.reason ?: @"Lỗi"}]; }
                  dispatch_async(dispatch_get_main_queue(), ^{ completion(bpm, beats, err); });
              });
          }
          @end

          static void ApplyImageToEditor(UIViewController *editor, UIImage *image) {
              if (!editor || !image) return;
              dispatch_async(dispatch_get_main_queue(), ^{
                  @try {
                      id engine = ((id (*)(id, SEL))objc_msgSend)(editor, NSSelectorFromString(@"engine"));
                      if (!engine) return;
                      NSArray *layers = ((id (*)(id, SEL))objc_msgSend)(engine, NSSelectorFromString(@"masterLayers"));
                      if (!layers) return;
                      for (id layer in layers) {
                          id imageGen = ((id (*)(id, SEL))objc_msgSend)(layer, NSSelectorFromString(@"imageGenerator"));
                          if (!imageGen) continue;
                          unsigned long long colorMode = 0;
                          if ([layer respondsToSelector:NSSelectorFromString(@"colorEffectMode")]) colorMode = ((unsigned long long (*)(id, SEL))objc_msgSend)(layer, NSSelectorFromString(@"colorEffectMode"));
                          if (colorMode > 0) continue;
                          @try {
                              [imageGen setValue:image forKey:@"layerImage"];
                              if ([imageGen respondsToSelector:NSSelectorFromString(@"newPhotoNotification:")]) {
                                  ((void (*)(id, SEL, id))objc_msgSend)(imageGen, NSSelectorFromString(@"newPhotoNotification:"), nil);
                              }
                          } @catch (NSException *e) {}
                      }
                      if ([editor respondsToSelector:NSSelectorFromString(@"updateDisplayAtFrame:")]) {
                          unsigned long long frame = 0;
                          if ([editor respondsToSelector:NSSelectorFromString(@"currentFrame")]) frame = ((unsigned long long (*)(id, SEL))objc_msgSend)(editor, NSSelectorFromString(@"currentFrame"));
                          ((void (*)(id, SEL, unsigned long long))objc_msgSend)(editor, NSSelectorFromString(@"updateDisplayAtFrame:"), frame);
                      } else if ([editor respondsToSelector:NSSelectorFromString(@"updatePreview")]) {
                          ((void (*)(id, SEL))objc_msgSend)(editor, NSSelectorFromString(@"updatePreview"));
                      }
                  } @catch (NSException *e) {}
              });
          }

          static void SplitSceneWithBeats(UIViewController *editor, NSArray<NSNumber *> *beats) {
              if (!editor || beats.count == 0) return;
              @try {
                  Class PMClass = NSClassFromString(@"ProjectManager") ?: NSClassFromString(@"_TtC10Video_Star14ProjectManager");
                  if (!PMClass) return;
                  id pm = ((id (*)(id, SEL))objc_msgSend)(PMClass, NSSelectorFromString(@"sharedInstance"));
                  id project = ((id (*)(id, SEL))objc_msgSend)(pm, NSSelectorFromString(@"activeEditProject"));
                  if (!project) return;
                  unsigned long long sceneIndex = 0;
                  if ([editor respondsToSelector:NSSelectorFromString(@"getSceneIndex")]) sceneIndex = ((unsigned long long (*)(id, SEL))objc_msgSend)(editor, NSSelectorFromString(@"getSceneIndex"));
                  else if ([editor respondsToSelector:NSSelectorFromString(@"sceneIndex")]) sceneIndex = ((unsigned long long (*)(id, SEL))objc_msgSend)(editor, NSSelectorFromString(@"sceneIndex"));
                  NSMutableArray *times = [NSMutableArray array];
                  for (NSNumber *beat in beats) {
                      CMTime cmTime = CMTimeMakeWithSeconds([beat doubleValue], 600);
                      [times addObject:[NSValue valueWithBytes:&cmTime objCType:@encode(CMTime)]];
                  }
                  SEL sel = NSSelectorFromString(@"multiSplitSceneAtIndex:times:progressView:completion:");
                  if ([project respondsToSelector:sel]) {
                      NSMethodSignature *sig = [project methodSignatureForSelector:sel];
                      if (sig) {
                          NSInvocation *inv = [NSInvocation invocationWithMethodSignature:sig];
                          [inv setTarget:project]; [inv setSelector:sel];
                          [inv setArgument:&sceneIndex atIndex:2]; [inv setArgument:&times atIndex:3];
                          id nilP = nil; [inv setArgument:&nilP atIndex:4];
                          void (^completion)(void) = ^{
                              UIAlertController *al = [UIAlertController alertControllerWithTitle:@"Hoàn tất" message:@"Đã chia phân cảnh!" preferredStyle:UIAlertControllerStyleAlert];
                              [al addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                              [editor presentViewController:al animated:YES completion:nil];
                          };
                          [inv setArgument:&completion atIndex:5]; [inv invoke];
                      }
                  }
              } @catch (NSException *e) {}
          }

          @interface VladMenuView : UIView
          @property (nonatomic, strong) UIView *panel;
          @property (nonatomic, strong) NSMutableArray<UIButton *> *tabButtons;
          @property (nonatomic, strong) UIView *contentView;
          - (void)setupUI; - (void)tabTapped:(UIButton *)sender; - (void)renderTab:(NSInteger)index; - (void)funcTapped:(UIButton *)sender; - (void)showAlert:(NSString *)title msg:(NSString *)msg; - (void)startHapticSync; - (void)closeTapped;
          @end

          @implementation VladMenuView
          - (instancetype)initWithFrame:(CGRect)frame { self = [super initWithFrame:frame]; if (self) [self setupUI]; return self; }
          - (void)setupUI {
              self.backgroundColor = [UIColor colorWithWhite:0 alpha:0.7];
              [self addGestureRecognizer:[[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(closeTapped)]];
              self.panel = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 320, 460)];
              self.panel.center = self.center;
              self.panel.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.07 alpha:0.98];
              self.panel.layer.cornerRadius = 16; self.panel.layer.borderWidth = 2.0; self.panel.layer.borderColor = [VladUI neonGreen].CGColor;
              self.panel.layer.shadowColor = [VladUI neonGreen].CGColor; self.panel.layer.shadowRadius = 12; self.panel.layer.shadowOpacity = 0.6; self.panel.layer.shadowOffset = CGSizeZero;
              [self.panel addGestureRecognizer:[[UITapGestureRecognizer alloc] initWithTarget:nil action:nil]];
              [self addSubview:self.panel];
              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(20, 25, 280, 30)];
              title.text = @"Sống Bằng Tình Cảm"; title.textColor = [UIColor whiteColor]; title.font = [UIFont fontWithName:@"HelveticaNeue-Bold" size:22]; title.textAlignment = NSTextAlignmentCenter; [self.panel addSubview:title];
              UILabel *subtitle = [[UILabel alloc] initWithFrame:CGRectMake(20, 55, 280, 20)];
              subtitle.text = @"Developer Vlad"; subtitle.textColor = [VladUI neonGreen]; subtitle.font = [UIFont systemFontOfSize:14]; subtitle.textAlignment = NSTextAlignmentCenter; [self.panel addSubview:subtitle];
              UIButton *close = [UIButton buttonWithType:UIButtonTypeCustom]; close.frame = CGRectMake(280, 20, 30, 30); [close setImage:[VladUI icon:@"xmark.circle.fill" size:22 color:[UIColor grayColor]] forState:UIControlStateNormal]; [close addTarget:self action:@selector(closeTapped) forControlEvents:UIControlEventTouchUpInside]; [self.panel addSubview:close];
              UIView *tabBar = [[UIView alloc] initWithFrame:CGRectMake(20, 90, 280, 40)]; tabBar.backgroundColor = [UIColor colorWithWhite:1 alpha:0.05]; tabBar.layer.cornerRadius = 8; [self.panel addSubview:tabBar];
              NSArray *titles = @[@"TRANG CHỦ", @"CHỨC NĂNG", @"TÁC GIẢ"]; self.tabButtons = [NSMutableArray array];
              for (int i=0; i<3; i++) {
                  UIButton *btn = [UIButton buttonWithType:UIButtonTypeCustom]; btn.frame = CGRectMake(i * 280.0/3.0, 0, 280.0/3.0, 40);
                  [btn setTitle:titles[i] forState:UIControlStateNormal]; [btn setTitleColor:[UIColor grayColor] forState:UIControlStateNormal]; [btn setTitleColor:[UIColor blackColor] forState:UIControlStateSelected];
                  btn.titleLabel.font = [UIFont boldSystemFontOfSize:11]; btn.tag = i; btn.layer.cornerRadius = 8; [btn addTarget:self action:@selector(tabTapped:) forControlEvents:UIControlEventTouchUpInside];
                  [tabBar addSubview:btn]; [self.tabButtons addObject:btn];
              }
              self.contentView = [[UIView alloc] initWithFrame:CGRectMake(20, 145, 280, 290)]; [self.panel addSubview:self.contentView]; [self tabTapped:self.tabButtons[0]];
          }
          - (void)tabTapped:(UIButton *)sender {
              for (UIButton *b in self.tabButtons) { b.selected = NO; b.backgroundColor = [UIColor clearColor]; [b setTitleColor:[UIColor grayColor] forState:UIControlStateNormal]; }
              sender.selected = YES; sender.backgroundColor = [VladUI neonGreen]; [sender setTitleColor:[UIColor blackColor] forState:UIControlStateSelected];
              [self renderTab:sender.tag];
          }
          - (void)renderTab:(NSInteger)index {
              for (UIView *v in self.contentView.subviews) [v removeFromSuperview];
              if (index == 0) {
                  UILabel *lbl = [[UILabel alloc] initWithFrame:self.contentView.bounds]; lbl.numberOfLines = 0; lbl.textColor = [UIColor lightGrayColor]; lbl.font = [UIFont systemFontOfSize:14]; lbl.textAlignment = NSTextAlignmentCenter;
                  lbl.text = @"Chào Mừng Bạn Đến Với Tool Video Star\n\nPhiên bản tối ưu & ổn định nhất."; [self.contentView addSubview:lbl];
              } else if (index == 1) {
                  NSArray *titles = @[@"Xem Code Gần Nhất", @"Tự Động Chia Beat", @"Tự Động Nhập Ảnh"];
                  NSArray *descs = @[@"Hiển thị ảnh mẫu vừa chọn", @"Cắt phân cảnh theo nhịp nhạc", @"Nhập ảnh hàng loạt thông minh"];
                  NSArray *icons = @[@"qrcode.viewfinder", @"waveform.path", @"photo.on.rectangle.angled"];
                  for (int i=0; i<3; i++) {
                      UIButton *btn = [UIButton buttonWithType:UIButtonTypeCustom]; btn.frame = CGRectMake(0, i*90, 280, 75); btn.backgroundColor = [UIColor colorWithRed:0.1 green:0.1 blue:0.12 alpha:0.9];
                      btn.layer.cornerRadius = 10; btn.layer.borderWidth = 1; btn.layer.borderColor = [[VladUI neonGreen] colorWithAlphaComponent:0.3].CGColor; btn.tag = i;
                      UIImageView *iconView = [[UIImageView alloc] initWithFrame:CGRectMake(15, 25, 24, 24)]; iconView.image = [VladUI icon:icons[i] size:24 color:[VladUI neonGreen]]; [btn addSubview:iconView];
                      UILabel *tLbl = [[UILabel alloc] initWithFrame:CGRectMake(55, 18, 210, 22)]; tLbl.text = titles[i]; tLbl.textColor = [UIColor whiteColor]; tLbl.font = [UIFont boldSystemFontOfSize:14]; [tLbl setUserInteractionEnabled:NO]; [btn addSubview:tLbl];
                      UILabel *dLbl = [[UILabel alloc] initWithFrame:CGRectMake(55, 38, 210, 18)]; dLbl.text = descs[i]; dLbl.textColor = [UIColor grayColor]; dLbl.font = [UIFont systemFontOfSize:11]; [dLbl setUserInteractionEnabled:NO]; [btn addSubview:dLbl];
                      [btn addTarget:self action:@selector(funcTapped:) forControlEvents:UIControlEventTouchUpInside]; [self.contentView addSubview:btn];
                  }
              } else {
                  UILabel *lbl = [[UILabel alloc] initWithFrame:self.contentView.bounds]; lbl.numberOfLines = 0; lbl.textColor = [UIColor grayColor]; lbl.textAlignment = NSTextAlignmentCenter; lbl.font = [UIFont systemFontOfSize:14];
                  lbl.text = @"Chủ sở hữu: Vlad\nNgười phát triển: Vlad\n\nVui lòng không leak tool dưới mọi hình thức."; [self.contentView addSubview:lbl];
              }
          }
          - (UIViewController *)getPresentingVC {
              UIWindow *keyWin = nil; for (UIWindow *w in [UIApplication sharedApplication].windows) { if (!w.hidden && w != gOverlayWindow) { keyWin = w; break; } }
              if (!keyWin) keyWin = [UIApplication sharedApplication].keyWindow; UIViewController *vc = keyWin.rootViewController;
              while (vc.presentedViewController) vc = vc.presentedViewController; return vc;
          }
          - (void)funcTapped:(UIButton *)sender {
              if (sender.tag == 0) {
                  if (gLastQRImage) {
                      UIView *blurView = [[UIView alloc] initWithFrame:self.bounds]; blurView.backgroundColor = [UIColor colorWithWhite:0 alpha:0.95]; blurView.tag = 999;
                      UIImageView *iv = [[UIImageView alloc] initWithImage:gLastQRImage]; iv.frame = CGRectInset(blurView.bounds, 30, 100); iv.contentMode = UIViewContentModeScaleAspectFit; iv.layer.cornerRadius = 12; iv.clipsToBounds = YES; [blurView addSubview:iv];
                      UIButton *close = [UIButton buttonWithType:UIButtonTypeCustom]; close.frame = CGRectMake(blurView.bounds.size.width/2 - 50, blurView.bounds.size.height - 80, 100, 44); [close setTitle:@"ĐÓNG" forState:UIControlStateNormal]; [close setTitleColor:[UIColor blackColor] forState:UIControlStateNormal];
                      close.backgroundColor = [VladUI neonGreen]; close.layer.cornerRadius = 22; close.titleLabel.font = [UIFont boldSystemFontOfSize:15]; [close addTarget:self action:@selector(closeBlur:) forControlEvents:UIControlEventTouchUpInside]; [blurView addSubview:close]; [self addSubview:blurView];
                  } else { [self showAlert:@"Thông báo" msg:@"Chưa có ảnh Code nào được lưu trong phiên này."]; }
              } else if (sender.tag == 1) {
                  if (!gCurrentSplitVC) { [self showAlert:@"Lỗi" msg:@"Hãy vào màn hình chia phân cảnh (Split Scene) trước khi bấm!"]; return; }
                  if (!gCurrentAudioURL) { [self showAlert:@"Lỗi" msg:@"Không tìm thấy nhạc đang phát trong app. Hãy phát nhạc trước!"]; return; }
                  [self showAlert:@"Đang phân tích" msg:@"Đợi xíu nhé, đang bắt nhịp..."];
                  [BeatDetector analyzeURL:gCurrentAudioURL completion:^(double bpm, NSArray<NSNumber *> *beats, NSError *error) {
                      if (error) { [self showAlert:@"Lỗi" msg:error.localizedDescription]; }
                      else {
                          gDetectedBPM = bpm; gDetectedBeats = beats; gCurrentPlayer = [[AVPlayer alloc] initWithURL:gCurrentAudioURL];
                          [self showAlert:@"Chia Beat Thành Công" msg:[NSString stringWithFormat:@"BPM: %.1f\nSố Beat: %lu\n\nĐang tự động chia...", bpm, (unsigned long)beats.count]];
                          SplitSceneWithBeats(gCurrentSplitVC, beats); [self startHapticSync];
                      }
                  }];
              } else if (sender.tag == 2) {
                  if (!gCurrentEditor) { [self showAlert:@"Lỗi" msg:@"Hãy mở Editor trước khi dùng chức năng này!"]; return; }
                  gIsAutoFillMode = YES;
                  @try {
                      if ([gCurrentEditor respondsToSelector:NSSelectorFromString(@"showPhotoPicker")]) ((void (*)(id, SEL))objc_msgSend)(gCurrentEditor, NSSelectorFromString(@"showPhotoPicker"));
                      else if ([gCurrentEditor respondsToSelector:NSSelectorFromString(@"pickNewContent")]) ((void (*)(id, SEL))objc_msgSend)(gCurrentEditor, NSSelectorFromString(@"pickNewContent"));
                      else { gIsAutoFillMode = NO; [self showAlert:@"Lỗi" msg:@"Không tìm thấy hàm mở thêm nội dung."]; }
                  } @catch (NSException *e) { gIsAutoFillMode = NO; [self showAlert:@"Lỗi" msg:e.reason]; }
              }
          }
          - (void)closeBlur:(UIButton *)btn { [btn.superview removeFromSuperview]; }
          - (void)startHapticSync {
              if (!gCurrentPlayer || !gDetectedBeats) return; if (gTimeObserver) { [gCurrentPlayer removeTimeObserver:gTimeObserver]; gTimeObserver = nil; }
              [gCurrentPlayer play]; NSArray *beats = gDetectedBeats; __block NSInteger lastIdx = -1;
              gTimeObserver = [gCurrentPlayer addPeriodicTimeObserverForInterval:CMTimeMake(1, 30) queue:dispatch_get_main_queue() usingBlock:^(CMTime time) {
                  double t = CMTimeGetSeconds(time);
                  for (NSInteger i = 0; i < (NSInteger)beats.count; i++) {
                      double bt = [beats[i] doubleValue];
                      if (bt > t - 0.05 && bt <= t + 0.05 && i != lastIdx) {
                          lastIdx = i; UIImpactFeedbackGenerator *gen = [[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleMedium];
                          [gen prepare]; [gen impactOccurred]; break;
                      }
                  }
              }];
          }
          - (void)showAlert:(NSString *)title msg:(NSString *)msg {
              UIAlertController *al = [UIAlertController alertControllerWithTitle:title message:msg preferredStyle:UIAlertControllerStyleAlert];
              [al addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
              [[self getPresentingVC] presentViewController:al animated:YES completion:nil];
          }
          - (void)closeTapped { [self removeFromSuperview]; }
          @end

          @interface VladLogoView : UIView
          - (void)logoTapped; - (void)logoPanned:(UIPanGestureRecognizer *)pan;
          @end
          @implementation VladLogoView
          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (self) {
                  self.backgroundColor = [UIColor colorWithWhite:0.05 alpha:0.9]; self.layer.cornerRadius = frame.size.width / 2; self.layer.borderWidth = 2.0; self.layer.borderColor = [VladUI neonGreen].CGColor;
                  self.layer.shadowColor = [VladUI neonGreen].CGColor; self.layer.shadowRadius = 8; self.layer.shadowOpacity = 1.0; self.layer.shadowOffset = CGSizeZero;
                  UILabel *lbl = [[UILabel alloc] initWithFrame:self.bounds]; lbl.text = @"V"; lbl.textColor = [VladUI neonGreen]; lbl.textAlignment = NSTextAlignmentCenter; lbl.font = [UIFont fontWithName:@"HelveticaNeue-Bold" size:28]; [self addSubview:lbl];
                  [self addGestureRecognizer:[[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(logoTapped)]];
                  [self addGestureRecognizer:[[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(logoPanned:)]];
              }
              return self;
          }
          - (void)logoTapped {
              if (!gOverlayWindow) return; UIView *rootView = gOverlayWindow.rootViewController.view;
              for (UIView *v in rootView.subviews) { if ([v isKindOfClass:[VladMenuView class]]) return; }
              [rootView addSubview:[[VladMenuView alloc] initWithFrame:rootView.bounds]];
          }
          - (void)logoPanned:(UIPanGestureRecognizer *)pan {
              CGPoint translation = [pan translationInView:self.superview];
              self.center = CGPointMake(self.center.x + translation.x, self.center.y + translation.y);
              [pan setTranslation:CGPointZero inView:self.superview];
          }
          @end

          @interface UIViewController (VladHook)
          - (void)vlad_viewDidLoad;
          @end
          @implementation UIViewController (VladHook)
          - (void)vlad_viewDidLoad {
              [self vlad_viewDidLoad];
              NSString *cls = NSStringFromClass([self class]);
              if ([cls containsString:@"MultiLayerWizEffectVC"] || [cls containsString:@"Editor"]) gCurrentEditor = self;
              if ([cls containsString:@"Split"] || [cls containsString:@"VideoReviewEditVC"]) gCurrentSplitVC = self;
          }
          @end

          @interface AVPlayer (VladHook)
          - (void)vlad_play;
          @end
          @implementation AVPlayer (VladHook)
          - (void)vlad_play {
              [self vlad_play]; gCurrentPlayer = self;
              AVPlayerItem *item = self.currentItem;
              if (item && [item.asset isKindOfClass:[AVURLAsset class]]) gCurrentAudioURL = ((AVURLAsset *)item.asset).URL;
          }
          @end

          @interface QRCodeManager (VladHook)
          - (void)vlad_selectedCode:(id)arg1 withImageData:(NSData *)data;
          @end
          @implementation QRCodeManager (VladHook)
          - (void)vlad_selectedCode:(id)arg1 withImageData:(NSData *)data {
              [self vlad_selectedCode:arg1 withImageData:data];
              if (data) gLastQRImage = [UIImage imageWithData:data];
          }
          @end

          @interface MultiLayerImageGenerator (VladHook)
          - (void)vlad_loadImageAsset:(id)asset;
          @end
          @implementation MultiLayerImageGenerator (VladHook)
          - (void)vlad_loadImageAsset:(id)asset {
              [self vlad_loadImageAsset:asset];
              if (gIsAutoFillMode) {
                  UIImage *img = [self valueForKey:@"layerImage"];
                  if (img && gCurrentEditor) {
                      gIsAutoFillMode = NO;
                      dispatch_async(dispatch_get_main_queue(), ^{ ApplyImageToEditor(gCurrentEditor, img); });
                  }
              }
          }
          @end

          __attribute__((constructor))
          static void initVlad() {
              @autoreleasepool {
                  Method orig1 = class_getInstanceMethod([UIViewController class], @selector(viewDidLoad));
                  Method new1 = class_getInstanceMethod([UIViewController class], @selector(vlad_viewDidLoad));
                  if (orig1 && new1) method_exchangeImplementations(orig1, new1);
                  Method orig2 = class_getInstanceMethod([AVPlayer class], @selector(play));
                  Method new2 = class_getInstanceMethod([AVPlayer class], @selector(vlad_play));
                  if (orig2 && new2) method_exchangeImplementations(orig2, new2);

                  Class qrClass = NSClassFromString(@"QRCodeManager");
                  if (qrClass) {
                      Method orig3 = class_getInstanceMethod(qrClass, NSSelectorFromString(@"selectedCode:withImageData:"));
                      Method new3 = class_getInstanceMethod(qrClass, NSSelectorFromString(@"vlad_selectedCode:withImageData:"));
                      if (orig3 && new3) method_exchangeImplementations(orig3, new3);
                  }
                  Class genClass = NSClassFromString(@"MultiLayerImageGenerator");
                  if (genClass) {
                      Method orig4 = class_getInstanceMethod(genClass, NSSelectorFromString(@"loadImageAsset:"));
                      Method new4 = class_getInstanceMethod(genClass, NSSelectorFromString(@"vlad_loadImageAsset:"));
                      if (orig4 && new4) method_exchangeImplementations(orig4, new4);
                  }

                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      if (!gOverlayWindow) {
                          gOverlayWindow = [[VSPassthroughWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                          gOverlayWindow.windowLevel = UIWindowLevelAlert + 10; gOverlayWindow.backgroundColor = [UIColor clearColor];
                          gOverlayWindow.rootViewController = [[UIViewController alloc] init]; gOverlayWindow.rootViewController.view.backgroundColor = [UIColor clearColor];
                          gOverlayWindow.hidden = NO;
                          [gOverlayWindow.rootViewController.view addSubview:[[VladLogoView alloc] initWithFrame:CGRectMake([UIScreen mainScreen].bounds.size.width - 66, 120, 50, 50)]];
                      }
                  });
              }
          }
          TWEAKEOF

      - name: Build
        run: |
          set -o pipefail
          make clean || true
          make -j1 VERBOSE=1 2>&1 | tee build.log
          DYLIB_PATH=$(find .theos/obj -name "VladAuto.dylib" -type f | head -n 1)
          mkdir -p output
          cp "$DYLIB_PATH" output/vlad.dylib
          install_name_tool -id "@rpath/vlad.dylib" output/vlad.dylib
          ldid -S output/vlad.dylib

      - name: Upload Vlad Dylib
        uses: actions/upload-artifact@v4
        with:
          name: vlad.dylib
          path: output/vlad.dylib
          if-no-files-found: error
