name: Build Vlad Dump
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          $THEOS/bin/update-theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Tải SDK
        run: |
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/iPhoneOS14.5.sdk $THEOS/sdks/

      - name: Setup Tools (ldid & dpkg)
        run: |
          brew install ldid dpkg

      - name: Tạo Build Files
        run: |
          cat << 'EOF' > Makefile
          ARCHS = arm64 arm64e
          TARGET = iphone:clang:latest:14.0
          include $(THEOS)/makefiles/common.mk
          LIBRARY_NAME = VladAuto
          VladAuto_FILES = Tweak.mm
          VladAuto_FRAMEWORKS = UIKit Foundation
          VladAuto_CFLAGS = -fobjc-arc -Wno-everything -std=c++17
          VladAuto_CCFLAGS = -std=c++17
          include $(THEOS_MAKE_PATH)/library.mk
          EOF

          cat << 'TWEAKEOF' > Tweak.mm
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>

          @interface VladDumpManager : NSObject
          + (void)startFullDump;
          @end

          @implementation VladDumpManager
          + (void)startFullDump {
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                  NSMutableString *log = [NSMutableString string];
                  [log appendString:@"=== VLAD FULL ROOT DUMP ===\n\n"];

                  // Lấy đường dẫn của app hiện tại (Video Star)
                  NSString *bundlePath = [[NSBundle mainBundle] executablePath];
                  const char *targetImage = [bundlePath UTF8String];

                  int numClasses = objc_getClassList(NULL, 0);
                  Class *classes = (__unsafe_unretained Class *)malloc(sizeof(Class) * numClasses);
                  numClasses = objc_getClassList(classes, numClasses);

                  for (int i = 0; i < numClasses; i++) {
                      @autoreleasepool {
                          Class cls = classes[i];
                          if (!cls) continue;

                          // Chỉ quét các class thuộc về app Video Star (bỏ qua UIKit, Foundation)
                          const char *imageName = class_getImageName(cls);
                          if (imageName && strcmp(imageName, targetImage) != 0) {
                              continue;
                          }

                          NSString *clsName = NSStringFromClass(cls);
                          
                          // Bắt đầu ghi class
                          [log appendFormat:@"\n@interface %@ ", clsName];
                          
                          // Ghi class cha
                          Class superCls = class_getSuperclass(cls);
                          if (superCls) {
                              [log appendFormat:@": %@ ", NSStringFromClass(superCls)];
                          }
                          [log appendString:@"{\n"];
                          
                          // Quét Ivar (biến toàn cục)
                          unsigned int ivarCount;
                          Ivar *ivars = class_copyIvarList(cls, &ivarCount);
                          for (int j = 0; j < ivarCount; j++) {
                              const char *type = ivar_getTypeEncoding(ivars[j]);
                              const char *name = ivar_getName(ivars[j]);
                              [log appendFormat:@"    %s %s;\n", type, name];
                          }
                          free(ivars);
                          [log appendString:@"}\n"];

                          // Quét Property
                          unsigned int propCount;
                          objc_property_t *props = class_copyPropertyList(cls, &propCount);
                          for (int j = 0; j < propCount; j++) {
                              const char *name = property_getName(props[j]);
                              const char *attr = property_getAttributes(props[j]);
                              [log appendFormat:@"@property %s %s;\n", attr, name];
                          }
                          free(props);
                          
                          // Quét Class Method (+)
                          unsigned int classMethodCount;
                          Method *classMethods = class_copyMethodList(object_getClass(cls), &classMethodCount);
                          for (int j = 0; j < classMethodCount; j++) {
                              [log appendFormat:@"+ (%s)%s;\n", 
                                  method_copyReturnType(classMethods[j]), 
                                  sel_getName(method_getName(classMethods[j]))];
                          }
                          free(classMethods);

                          // Quét Instance Method (-)
                          unsigned int methodCount;
                          Method *methods = class_copyMethodList(cls, &methodCount);
                          for (int j = 0; j < methodCount; j++) {
                              [log appendFormat:@"- (%s)%s;\n", 
                                  method_copyReturnType(methods[j]), 
                                  sel_getName(method_getName(methods[j]))];
                          }
                          free(methods);

                          [log appendString:@"@end\n"];
                      }
                  }
                  free(classes);

                  // Lưu ra file trong thư mục Tmp
                  NSString *tmpDir = NSTemporaryDirectory();
                  NSString *filePath = [tmpDir stringByAppendingPathComponent:@"VladFullDump.txt"];
                  [log writeToFile:filePath atomically:YES encoding:NSUTF8StringEncoding error:nil];

                  dispatch_async(dispatch_get_main_queue(), ^{
                      // Hiển thị Share Sheet để mày lưu file
                      NSURL *fileURL = [NSURL fileURLWithPath:filePath];
                      UIActivityViewController *activityVC = [[UIActivityViewController alloc] initWithActivityItems:@[fileURL] applicationActivities:nil];
                      
                      // Fix crash trên iPad (nếu có)
                      activityVC.popoverPresentationController.sourceView = [UIApplication sharedApplication].keyWindow.rootViewController.view;
                      activityVC.popoverPresentationController.sourceRect = CGRectMake([UIScreen mainScreen].bounds.size.width/2, [UIScreen mainScreen].bounds.size.height/2, 0, 0);
                      
                      UIWindow *keyWin = [UIApplication sharedApplication].keyWindow;
                      UIViewController *topVC = keyWin.rootViewController;
                      while (topVC.presentedViewController) {
                          topVC = topVC.presentedViewController;
                      }
                      [topVC presentViewController:activityVC animated:YES completion:nil];
                  });
              });
          }
          @end

          __attribute__((constructor))
          static void initVlad() {
              @autoreleasepool {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      [VladDumpManager startFullDump];
                  });
              }
          }
          TWEAKEOF

      - name: Build
        run: |
          set -o pipefail
          make clean || true
          make -j1 VERBOSE=1 2>&1 | tee build.log
          DYLIB_PATH=$(find .theos/obj -name "VladAuto.dylib" -type f | head -n 1)
          mkdir -p output
          cp "$DYLIB_PATH" output/vlad_dump.dylib
          install_name_tool -id "@rpath/vlad_dump.dylib" output/vlad_dump.dylib
          ldid -S output/vlad_dump.dylib

      - name: Upload Vlad Dylib
        uses: actions/upload-artifact@v4
        with:
          name: vlad_dump
          path: output/vlad_dump.dylib
          if-no-files-found: error
