          - (UIViewController *)presentingVC {
              UIWindow *kw = nil;
              if (@available(iOS 13.0, *)) {
                  for (UIScene *s in [UIApplication sharedApplication].connectedScenes) {
                      if (s.activationState != UISceneActivationStateForegroundActive) continue;
                      if ([s isKindOfClass:[UIWindowScene class]]) {
                          for (UIWindow *w in ((UIWindowScene *)s).windows) {
                              if (!w.hidden && w != gOverlayWindow) { kw = w; break; }
                          }
                      }
                      if (kw) break;
                  }
              }
              if (!kw) kw = [UIApplication sharedApplication].keyWindow;
              if (!kw && gOverlayWindow) kw = gOverlayWindow;
              UIViewController *vc = kw.rootViewController;
              while (vc.presentedViewController) vc = vc.presentedViewController;
              return vc;
          }
          - (void)showAlert:(NSString *)title msg:(NSString *)msg {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIAlertController *al = [UIAlertController alertControllerWithTitle:title message:msg
                                                                      preferredStyle:UIAlertControllerStyleAlert];
                  [al addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                  UIViewController *p = [self presentingVC];
                  if (p) [p presentViewController:al animated:YES completion:nil];
              });
          }
          - (void)funcTapped:(UIButton *)sender {
              if (sender.tag == 0) {
                  if (!gLastQRImage) gLastQRImage = VladLoadQRImage();
                  if (!gLastQRCode) gLastQRCode = VladLoadQRCode();
                  if (!gLastQRImage) {
                      [self showAlert:@"Chưa Có Code"
                                  msg:@"Chưa có ảnh QR nào được lưu.\nHãy quét QR trong app trước."];
                      return;
                  }
                  dispatch_async(dispatch_get_main_queue(), ^{
                      VladQRPreviewVC *vc = [[VladQRPreviewVC alloc] initWithImage:gLastQRImage code:gLastQRCode];
                      UIViewController *p = [self presentingVC];
                      if (p) [p presentViewController:vc animated:YES completion:nil];
                  });
              }
              else if (sender.tag == 1) {
                  UIViewController *splitVC = FindSplitVC();
                  if (!splitVC || !splitVC.view.window) {
                      [self showAlert:@"Chưa Mở Trình Chia Cảnh"
                                  msg:@"Hãy vào màn hình VideoReviewEditVC trước."];
                      return;
                  }
                  id project = nil;
                  if ([splitVC respondsToSelector:@selector(project)])
                      project = ((id (*)(id, SEL))objc_msgSend)(splitVC, @selector(project));
                  if (!project) { [self showAlert:@"Lỗi" msg:@"Không lấy được project."]; return; }

                  unsigned long long sceneIndex = 0;
                  if ([splitVC respondsToSelector:@selector(sceneIndex)])
                      sceneIndex = ((unsigned long long (*)(id, SEL))objc_msgSend)(splitVC, @selector(sceneIndex));

                  [self showAlert:@"Đang Phân Tích" msg:@"Đang bắt nhịp..."];
                  __weak typeof(self) weakSelf = self;
                  [VladBeatDetector detectFromProject:project scene:(NSInteger)sceneIndex
                                           completion:^(double bpm, NSArray<NSValue *> *times, NSError *error) {
                      __strong typeof(weakSelf) self = weakSelf;
                      if (!self) return;
                      if (error) { [self showAlert:@"Lỗi" msg:error.localizedDescription]; return; }

                      NSArray<NSValue *> *toUse = times;
                      if (times.count > 60) {
                          NSInteger step = (times.count + 59) / 60;
                          NSMutableArray *sampled = [NSMutableArray array];
                          for (NSInteger i = 0; i < (NSInteger)times.count; i += step)
                              [sampled addObject:times[i]];
                          toUse = sampled;
                          NSLog(@"[Vlad] Cap %lu -> %lu splits (step %ld)",
                                (unsigned long)times.count, (unsigned long)toUse.count, (long)step);
                      }

                      NSString *msg = [NSString stringWithFormat:
                          @"BPM: %.1f\nTổng beat gốc: %lu\nSẽ chia thành: %lu phân cảnh\n\nTiếp tục?",
                          bpm, (unsigned long)times.count, (unsigned long)toUse.count];
                      UIAlertController *al = [UIAlertController alertControllerWithTitle:@"Chia Beat"
                                                                              message:msg
                                                                       preferredStyle:UIAlertControllerStyleAlert];
                      [al addAction:[UIAlertAction actionWithTitle:@"Huỷ" style:UIAlertActionStyleCancel handler:nil]];
                      [al addAction:[UIAlertAction actionWithTitle:@"CHIA" style:UIAlertActionStyleDestructive
                                                          handler:^(UIAlertAction *a) {
                          [self showAlert:@"Đang Chia" msg:@"Vui lòng đợi..."];
                          SplitSceneWithTimes(splitVC, toUse, ^(NSError *e, NSInteger cnt) {
                              if (e) [self showAlert:@"Kết Quả" msg:e.localizedDescription];
                              else [self showAlert:@"Hoàn Tất"
                                              msg:[NSString stringWithFormat:@"Đã chia %ld phân cảnh!", (long)cnt]];
                          });
                          NSMutableArray<NSNumber *> *secs = [NSMutableArray array];
                          for (NSValue *v in toUse) {
                              CMTime t; [v getValue:&t];
                              [secs addObject:@(CMTimeGetSeconds(t))];
                          }
                          NSURL *audioURL = nil;
                          @try {
                              id fm = [project valueForKey:@"fileManager"];
                              if (fm && [fm respondsToSelector:@selector(trimmedSongURL)])
                                  audioURL = ((id (*)(id, SEL))objc_msgSend)(fm, @selector(trimmedSongURL));
                              if (!audioURL && fm && [fm respondsToSelector:@selector(songURL)])
                                  audioURL = ((id (*)(id, SEL))objc_msgSend)(fm, @selector(songURL));
                          } @catch (NSException *e) {}
                          if (audioURL) StartHapticSync(secs, audioURL);
                      }]];
                      UIViewController *p = [self presentingVC];
                      if (p) [p presentViewController:al animated:YES completion:nil];
                  }];
              }
              else if (sender.tag == 2) {
                  UIViewController *editor = FindEditor();
                  if (!editor || !editor.view.window) {
                      [self showAlert:@"Chưa Mở Editor"
                                  msg:@"Hãy mở MultiLayerWizEffectVC trước."];
                      return;
                  }
                  gCurrentEditor = editor;
                  gIsAutoFillMode = YES;
                  @try {
                      if ([editor respondsToSelector:@selector(showPhotoPicker)])
                          ((void (*)(id, SEL))objc_msgSend)(editor, @selector(showPhotoPicker));
                      else if ([editor respondsToSelector:@selector(pickNewContent)])
                          ((void (*)(id, SEL))objc_msgSend)(editor, @selector(pickNewContent));
                      else {
                          gIsAutoFillMode = NO;
                          [self showAlert:@"Lỗi" msg:@"Không tìm thấy hàm mở thư viện ảnh."];
                      }
                  } @catch (NSException *e) {
                      gIsAutoFillMode = NO;
                      [self showAlert:@"Lỗi" msg:e.reason ?: @"Lỗi"];
                  }
              }
          }
          - (void)closeTapped { [self removeFromSuperview]; }
          @end

