name: Build Vlad Tool Final
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tạo RAM ảo
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Cài Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs make clang libssl-dev libplist-dev xz-utils curl fakeroot zip unzip wget dpkg
          git lfs install

          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/ldid > /dev/null
          sudo chmod +x /usr/local/bin/ldid

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Tải SDK (dùng git LFS — KHÔNG curl)
        run: |
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git lfs pull
          ls -la /tmp/sdks/*.sdk.zip | head -5

          cp /tmp/sdks/iPhoneOS14.5.sdk.zip $THEOS/sdks/
          cd $THEOS/sdks && unzip -q iPhoneOS14.5.sdk.zip && rm iPhoneOS14.5.sdk.zip

          echo "=== SDK đã cài ==="
          ls -la $THEOS/sdks/

      - name: Tạo Build Files
        run: |
          cat << 'EOF' > Makefile
          ARCHS = arm64
          TARGET = iphone:clang:latest:14.0
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = VladAuto
          VladAuto_FILES = Tweak.xm
          VladAuto_FRAMEWORKS = UIKit Foundation AVFoundation Photos PhotosUI QuartzCore
          VladAuto_CFLAGS = -fobjc-arc -Wno-everything
          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

          cat << 'EOF' > control
          Package: com.vlad.limited
          Name: Sống Bằng Tình Cảm
          Version: 5.0.0
          Architecture: iphoneos-arm
          Description: Vlad Limited Edition - Video Star Tool
          Maintainer: Vlad
          Author: Vlad
          Section: Tweaks
          EOF

          cat << 'TWEAKEOF' > Tweak.xm
          #import <UIKit/UIKit.h>
          #import <AVFoundation/AVFoundation.h>
          #import <Photos/Photos.h>
          #import <PhotosUI/PhotosUI.h>
          #import <QuartzCore/QuartzCore.h>
          #import <objc/runtime.h>

          static UIImage *gLastQRImage = nil;
          static UIWindow *gOverlayWindow = nil;
          static UIViewController *gCurrentEditor = nil;
          static NSURL *gCurrentAudioURL = nil;
          static AVPlayer *gCurrentPlayer = nil;
          static NSArray<NSNumber *> *gDetectedBeats = nil;
          static double gDetectedBPM = 0;
          static id gTimeObserver = nil;

          static void searchImageViews(UIView *parent, NSMutableArray *array);
          static void autoFillSmart(UIViewController *editor);

          @interface VSPassthroughWindow : UIWindow
          @end
          @implementation VSPassthroughWindow
          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              UIView *hitView = [super hitTest:point withEvent:event];
              if (hitView == self || hitView == self.rootViewController.view) return nil;
              return hitView;
          }
          @end

          @interface VladIcons : NSObject
          + (UIImage *)qrIconWithSize:(CGFloat)size color:(UIColor *)color;
          + (UIImage *)imageIconWithSize:(CGFloat)size color:(UIColor *)color;
          + (UIImage *)musicIconWithSize:(CGFloat)size color:(UIColor *)color;
          + (UIImage *)vLogoWithSize:(CGFloat)size color:(UIColor *)color;
          @end

          @implementation VladIcons
          + (UIImage *)qrIconWithSize:(CGFloat)size color:(UIColor *)color {
              UIGraphicsImageRenderer *renderer = [[UIGraphicsImageRenderer alloc] initWithSize:CGSizeMake(size, size)];
              return [renderer imageWithActions:^(UIGraphicsImageRendererContext * _Nonnull context) {
                  [color setStroke];
                  UIBezierPath *path = [UIBezierPath bezierPath];
                  path.lineWidth = 2.0;
                  [path appendPath:[UIBezierPath bezierPathWithRect:CGRectMake(2, 2, size*0.3, size*0.3)]];
                  [path appendPath:[UIBezierPath bezierPathWithRect:CGRectMake(size - size*0.3 - 2, 2, size*0.3, size*0.3)]];
                  [path appendPath:[UIBezierPath bezierPathWithRect:CGRectMake(2, size - size*0.3 - 2, size*0.3, size*0.3)]];
                  [path moveToPoint:CGPointMake(size*0.5, size*0.5)];
                  [path addLineToPoint:CGPointMake(size*0.7, size*0.5)];
                  [path addLineToPoint:CGPointMake(size*0.7, size*0.7)];
                  [path addLineToPoint:CGPointMake(size*0.5, size*0.7)];
                  [path closePath];
                  [path stroke];
              }];
          }
          + (UIImage *)imageIconWithSize:(CGFloat)size color:(UIColor *)color {
              UIGraphicsImageRenderer *renderer = [[UIGraphicsImageRenderer alloc] initWithSize:CGSizeMake(size, size)];
              return [renderer imageWithActions:^(UIGraphicsImageRendererContext * _Nonnull context) {
                  [color setStroke];
                  UIBezierPath *path = [UIBezierPath bezierPath];
                  path.lineWidth = 2.0;
                  [path appendPath:[UIBezierPath bezierPathWithRoundedRect:CGRectMake(2, 2, size-4, size-4) cornerRadius:4]];
                  [path moveToPoint:CGPointMake(size*0.3, size*0.7)];
                  [path addLineToPoint:CGPointMake(size*0.7, size*0.3)];
                  [path moveToPoint:CGPointMake(size*0.7, size*0.3)];
                  [path addLineToPoint:CGPointMake(size*0.5, size*0.3)];
                  [path moveToPoint:CGPointMake(size*0.7, size*0.3)];
                  [path addLineToPoint:CGPointMake(size*0.7, size*0.5)];
                  [path stroke];
              }];
          }
          + (UIImage *)musicIconWithSize:(CGFloat)size color:(UIColor *)color {
              UIGraphicsImageRenderer *renderer = [[UIGraphicsImageRenderer alloc] initWithSize:CGSizeMake(size, size)];
              return [renderer imageWithActions:^(UIGraphicsImageRendererContext * _Nonnull context) {
                  [color setStroke];
                  UIBezierPath *path = [UIBezierPath bezierPath];
                  path.lineWidth = 2.0;
                  [path appendPath:[UIBezierPath bezierPathWithOvalInRect:CGRectMake(size*0.2, size*0.6, size*0.2, size*0.15)]];
                  [path moveToPoint:CGPointMake(size*0.4, size*0.6)];
                  [path addLineToPoint:CGPointMake(size*0.4, size*0.2)];
                  [path appendPath:[UIBezierPath bezierPathWithOvalInRect:CGRectMake(size*0.5, size*0.5, size*0.2, size*0.15)]];
                  [path moveToPoint:CGPointMake(size*0.7, size*0.5)];
                  [path addLineToPoint:CGPointMake(size*0.7, size*0.1)];
                  [path moveToPoint:CGPointMake(size*0.4, size*0.2)];
                  [path addLineToPoint:CGPointMake(size*0.7, size*0.1)];
                  [path stroke];
              }];
          }
          + (UIImage *)vLogoWithSize:(CGFloat)size color:(UIColor *)color {
              UIGraphicsImageRenderer *renderer = [[UIGraphicsImageRenderer alloc] initWithSize:CGSizeMake(size, size)];
              return [renderer imageWithActions:^(UIGraphicsImageRendererContext * _Nonnull context) {
                  [color setStroke];
                  [color setFill];
                  UIBezierPath *circle = [UIBezierPath bezierPathWithOvalInRect:CGRectMake(2, 2, size-4, size-4)];
                  circle.lineWidth = 2.0;
                  [circle stroke];
                  UIBezierPath *v = [UIBezierPath bezierPath];
                  v.lineWidth = 4.0;
                  [v moveToPoint:CGPointMake(size*0.3, size*0.3)];
                  [v addLineToPoint:CGPointMake(size*0.5, size*0.7)];
                  [v addLineToPoint:CGPointMake(size*0.7, size*0.3)];
                  [v stroke];
              }];
          }
          @end

          // ==========================================
          // BEAT DETECTOR
          // ==========================================
          @interface BeatDetector : NSObject
          + (void)analyzeURL:(NSURL *)url completion:(void(^)(double bpm, NSArray<NSNumber *> *beats, NSError *error))completion;
          @end

          @implementation BeatDetector
          + (void)analyzeURL:(NSURL *)url completion:(void(^)(double bpm, NSArray<NSNumber *> *beats, NSError *error))completion {
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  NSError *err = nil;
                  NSArray *beats = nil;
                  double bpm = 0;

                  @try {
                      AVURLAsset *asset = [AVURLAsset URLAssetWithURL:url options:nil];
                      AVAssetTrack *track = [asset tracksWithMediaType:AVMediaTypeAudio].firstObject;
                      if (!track) {
                          err = [NSError errorWithDomain:@"Vlad" code:1 userInfo:@{NSLocalizedDescriptionKey:@"File không có audio track"}];
                      } else {
                          AVAssetReader *reader = [AVAssetReader assetReaderWithAsset:asset error:&err];
                          if (reader) {
                              NSDictionary *settings = @{
                                  AVFormatIDKey: @(kAudioFormatLinearPCM),
                                  AVLinearPCMBitDepthKey: @16,
                                  AVLinearPCMIsFloatKey: @NO,
                                  AVLinearPCMIsBigEndianKey: @NO,
                                  AVLinearPCMIsNonInterleaved: @NO,
                                  AVSampleRateKey: @22050,
                                  AVNumberOfChannelsKey: @1
                              };
                              AVAssetReaderTrackOutput *out = [[AVAssetReaderTrackOutput alloc] initWithTrack:track outputSettings:settings];
                              out.alwaysCopiesSampleData = NO;
                              [reader addOutput:out];
                              [reader startReading];

                              NSMutableData *allPCM = [NSMutableData data];
                              CMSampleBufferRef sample;
                              while ((sample = [out copyNextSampleBuffer])) {
                                  CMBlockBufferRef block = CMSampleBufferGetDataBuffer(sample);
                                  if (block) {
                                      size_t len = CMBlockBufferGetDataLength(block);
                                      int16_t *buf = malloc(len);
                                      CMBlockBufferCopyDataBytes(block, 0, len, buf);
                                      [allPCM appendBytes:buf length:len];
                                      free(buf);
                                  }
                                  CFRelease(sample);
                              }
                              [reader cancelReading];

                              NSInteger sampleCount = allPCM.length / sizeof(int16_t);
                              int16_t *samples = (int16_t *)allPCM.bytes;
                              const int hop = 512;
                              NSInteger frames = sampleCount / hop;

                              if (frames < 16) {
                                  err = [NSError errorWithDomain:@"Vlad" code:2 userInfo:@{NSLocalizedDescriptionKey:@"Audio quá ngắn"}];
                              } else {
                                  double *energy = malloc(frames * sizeof(double));
                                  for (NSInteger i = 0; i < frames; i++) {
                                      double e = 0;
                                      for (int j = 0; j < hop; j++) {
                                          double s = samples[i*hop + j] / 32768.0;
                                          e += s * s;
                                      }
                                      energy[i] = e / hop;
                                  }

                                  double *onset = malloc(frames * sizeof(double));
                                  for (NSInteger i = 0; i < frames; i++) {
                                      double prev = (i > 0) ? energy[i-1] : energy[0];
                                      double v = energy[i] - prev;
                                      onset[i] = (v > 0) ? v : 0;
                                  }

                                  NSInteger searchMin = 14;
                                  NSInteger searchMax = 86;
                                  if (searchMax >= frames) searchMax = frames - 1;
                                  NSInteger bestLag = 0;
                                  double bestScore = 0;

                                  for (NSInteger lag = searchMin; lag < searchMax; lag++) {
                                      double sum = 0;
                                      for (NSInteger i = 0; i < frames - lag; i++) {
                                          sum += onset[i] * onset[i+lag];
                                      }
                                      sum /= (frames - lag);
                                      double prefer = 1.0;
                                      if (lag < 16 || lag > 32) prefer = 0.7;
                                      sum *= prefer;
                                      if (sum > bestScore) {
                                          bestScore = sum;
                                          bestLag = lag;
                                      }
                                  }

                                  if (bestLag > 0) {
                                      double fps = 22050.0 / hop;
                                      double beatPeriodSec = bestLag / fps;
                                      bpm = 60.0 / beatPeriodSec;

                                      double threshold = 0;
                                      for (NSInteger i = 0; i < frames; i++) threshold += onset[i];
                                      threshold /= frames;
                                      threshold *= 1.5;

                                      NSMutableArray *list = [NSMutableArray array];
                                      for (NSInteger i = 1; i < frames - 1; i++) {
                                          if (onset[i] > threshold && onset[i] > onset[i-1] && onset[i] >= onset[i+1]) {
                                              double t = (double)i * hop / 22050.0;
                                              [list addObject:@(t)];
                                          }
                                      }
                                      beats = list;
                                      if (list.count == 0) {
                                          err = [NSError errorWithDomain:@"Vlad" code:3 userInfo:@{NSLocalizedDescriptionKey:@"Không phát hiện beat"}];
                                      }
                                  } else {
                                      err = [NSError errorWithDomain:@"Vlad" code:4 userInfo:@{NSLocalizedDescriptionKey:@"Không tìm được tempo"}];
                                  }

                                  free(energy);
                                  free(onset);
                              }
                          }
                      }
                  } @catch (NSException *e) {
                      err = [NSError errorWithDomain:@"Vlad" code:99 userInfo:@{NSLocalizedDescriptionKey: e.reason ?: @"Lỗi phân tích"}];
                  }

                  dispatch_async(dispatch_get_main_queue(), ^{
                      completion(bpm, beats, err);
                  });
              });
          }
          @end

          // ==========================================
          // MENU
          // ==========================================
          @interface VladMenuView : UIView
          @property (nonatomic, strong) UIView *panel;
          @property (nonatomic, strong) NSArray *tabButtons;
          @property (nonatomic, strong) UIView *contentView;
          - (void)setupUI;
          - (void)tabTapped:(UIButton *)sender;
          - (void)renderTab:(NSInteger)index;
          - (void)funcTapped:(UIButton *)sender;
          - (void)showAlert:(NSString *)title msg:(NSString *)msg;
          - (void)startHapticSync;
          - (void)closeTapped;
          @end

          @implementation VladMenuView
          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (self) [self setupUI];
              return self;
          }
          - (void)setupUI {
              self.backgroundColor = [UIColor colorWithWhite:0 alpha:0.7];
              CGFloat width = 340, height = 400;
              self.panel = [[UIView alloc] initWithFrame:CGRectMake(0, 0, width, height)];
              self.panel.center = self.center;
              self.panel.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.08 alpha:0.98];
              self.panel.layer.cornerRadius = 16;
              self.panel.layer.borderWidth = 1.5;
              self.panel.layer.borderColor = [UIColor colorWithRed:0.0 green:0.8 blue:1.0 alpha:1.0].CGColor;
              self.panel.layer.shadowColor = [UIColor colorWithRed:0.0 green:0.8 blue:1.0 alpha:1.0].CGColor;
              self.panel.layer.shadowRadius = 20;
              self.panel.layer.shadowOpacity = 0.8;
              self.panel.layer.shadowOffset = CGSizeZero;
              [self addSubview:self.panel];

              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(20, 20, width-40, 30)];
              title.text = @"Sống Bằng Tình Cảm";
              title.textColor = [UIColor whiteColor];
              title.font = [UIFont boldSystemFontOfSize:22];
              [self.panel addSubview:title];

              UILabel *subtitle = [[UILabel alloc] initWithFrame:CGRectMake(20, 50, width-40, 20)];
              subtitle.text = @"Developer: Vlad";
              subtitle.textColor = [UIColor colorWithRed:0.0 green:0.8 blue:1.0 alpha:1.0];
              subtitle.font = [UIFont systemFontOfSize:14];
              [self.panel addSubview:subtitle];

              UIButton *close = [UIButton buttonWithType:UIButtonTypeCustom];
              close.frame = CGRectMake(width - 40, 20, 30, 30);
              [close setTitle:@"X" forState:UIControlStateNormal];
              [close setTitleColor:[UIColor redColor] forState:UIControlStateNormal];
              [close addTarget:self action:@selector(closeTapped) forControlEvents:UIControlEventTouchUpInside];
              [self.panel addSubview:close];

              NSArray *titles = @[@"TRANG CHỦ", @"CHỨC NĂNG", @"TÁC GIẢ"];
              NSMutableArray *btns = [NSMutableArray array];
              for (int i=0; i<3; i++) {
                  UIButton *btn = [UIButton buttonWithType:UIButtonTypeCustom];
                  btn.frame = CGRectMake(0, 90 + i*50, 100, 50);
                  [btn setTitle:titles[i] forState:UIControlStateNormal];
                  [btn setTitleColor:[UIColor grayColor] forState:UIControlStateNormal];
                  [btn setTitleColor:[UIColor colorWithRed:0.0 green:0.8 blue:1.0 alpha:1.0] forState:UIControlStateSelected];
                  btn.titleLabel.font = [UIFont boldSystemFontOfSize:12];
                  btn.tag = i;
                  btn.contentHorizontalAlignment = UIControlContentHorizontalAlignmentLeft;
                  btn.titleEdgeInsets = UIEdgeInsetsMake(0, 20, 0, 0);
                  [btn addTarget:self action:@selector(tabTapped:) forControlEvents:UIControlEventTouchUpInside];
                  [self.panel addSubview:btn];
                  [btns addObject:btn];
              }
              self.tabButtons = btns;
              ((UIButton *)self.tabButtons[0]).selected = YES;

              UIView *divider = [[UIView alloc] initWithFrame:CGRectMake(100, 90, 1, 200)];
              divider.backgroundColor = [UIColor colorWithWhite:0.3 alpha:1.0];
              [self.panel addSubview:divider];

              self.contentView = [[UIView alloc] initWithFrame:CGRectMake(120, 90, width-140, 280)];
              [self.panel addSubview:self.contentView];

              [self renderTab:0];
          }

          - (void)tabTapped:(UIButton *)sender {
              for (UIButton *b in self.tabButtons) b.selected = NO;
              sender.selected = YES;
              [self renderTab:sender.tag];
          }

          - (void)renderTab:(NSInteger)index {
              for (UIView *v in self.contentView.subviews) [v removeFromSuperview];
              if (index == 0) {
                  UILabel *lbl = [[UILabel alloc] initWithFrame:self.contentView.bounds];
                  lbl.numberOfLines = 0;
                  lbl.textColor = [UIColor lightGrayColor];
                  lbl.font = [UIFont systemFontOfSize:14];
                  lbl.text = @"CHÀO MỪNG ĐẾN VỚI\nSỐNG BẰNG TÌNH CẢM\n\nPhiên bản: Limited\nTrạng thái bảo mật: Tối ưu 100%\n\nHướng dẫn: Chọn các tính năng ở tab CHỨC NĂNG để bắt đầu. Hệ thống tự động nhận diện lớp Video và Văn bản.";
                  [self.contentView addSubview:lbl];
              }
              else if (index == 1) {
                  NSArray *funcs = @[@"XEM MÃ QR CŨ", @"ĐIỀN ẢNH HÀNG LOẠT", @"BẮT NHỊP TỰ ĐỘNG"];
                  for (int i=0; i<3; i++) {
                      UIButton *btn = [UIButton buttonWithType:UIButtonTypeCustom];
                      btn.frame = CGRectMake(0, i*70, self.contentView.bounds.size.width, 60);
                      btn.backgroundColor = [UIColor colorWithRed:0.1 green:0.1 blue:0.15 alpha:1.0];
                      btn.layer.cornerRadius = 8;
                      btn.layer.borderWidth = 1.0;
                      btn.layer.borderColor = [UIColor colorWithRed:0.0 green:0.8 blue:1.0 alpha:0.5].CGColor;
                      btn.tag = i;
                      UIImage *icon = nil;
                      if (i == 0) icon = [VladIcons qrIconWithSize:24 color:[UIColor colorWithRed:0.0 green:0.8 blue:1.0 alpha:1.0]];
                      if (i == 1) icon = [VladIcons imageIconWithSize:24 color:[UIColor colorWithRed:0.0 green:0.8 blue:1.0 alpha:1.0]];
                      if (i == 2) icon = [VladIcons musicIconWithSize:24 color:[UIColor colorWithRed:0.0 green:0.8 blue:1.0 alpha:1.0]];
                      [btn setImage:icon forState:UIControlStateNormal];
                      btn.imageEdgeInsets = UIEdgeInsetsMake(0, 10, 0, 10);
                      [btn setTitle:funcs[i] forState:UIControlStateNormal];
                      [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                      btn.titleLabel.font = [UIFont boldSystemFontOfSize:12];
                      btn.contentHorizontalAlignment = UIControlContentHorizontalAlignmentLeft;
                      btn.titleEdgeInsets = UIEdgeInsetsMake(0, 20, 0, 0);
                      [btn addTarget:self action:@selector(funcTapped:) forControlEvents:UIControlEventTouchUpInside];
                      [self.contentView addSubview:btn];
                  }
              }
              else {
                  UILabel *lbl = [[UILabel alloc] initWithFrame:self.contentView.bounds];
                  lbl.numberOfLines = 0;
                  lbl.textColor = [UIColor colorWithRed:1.0 green:0.0 blue:0.5 alpha:1.0];
                  lbl.textAlignment = NSTextAlignmentCenter;
                  lbl.font = [UIFont systemFontOfSize:14];
                  lbl.text = @"Chủ sở hữu: Vlad\nNgười tạo tool: Vlad\n\nLƯU Ý:\nNghiêm cấm trộm code, leak tool dưới mọi hình thức!";
                  [self.contentView addSubview:lbl];
              }
          }

          - (void)funcTapped:(UIButton *)sender {
              if (sender.tag == 0) {
                  if (gLastQRImage) {
                      UIImageView *iv = [[UIImageView alloc] initWithImage:gLastQRImage];
                      iv.frame = self.contentView.bounds;
                      iv.contentMode = UIViewContentModeScaleAspectFit;
                      iv.tag = 888;
                      [self.contentView addSubview:iv];
                  } else {
                      [self showAlert:@"Lỗi" msg:@"Chưa có ảnh mẫu nào được lưu."];
                  }
              } else if (sender.tag == 1) {
                  [self showAlert:@"Hướng dẫn" msg:@"Hãy dùng tính năng chọn ảnh của Video Star. Tool sẽ tự động lấy ảnh mày chọn và điền vào các lớp Video/Văn bản."];
              } else if (sender.tag == 2) {
                  if (!gCurrentAudioURL) {
                      [self showAlert:@"Chưa có nhạc" msg:@"Hãy phát bài hát trong Video Star trước, rồi bấm lại."];
                      return;
                  }
                  [self showAlert:@"Đang phân tích" msg:@"Đợi chút..."];
                  [BeatDetector analyzeURL:gCurrentAudioURL completion:^(double bpm, NSArray<NSNumber *> *beats, NSError *error) {
                      if (error) {
                          [self showAlert:@"Lỗi" msg:error.localizedDescription];
                      } else {
                          gDetectedBPM = bpm;
                          gDetectedBeats = beats;
                          NSString *msg = [NSString stringWithFormat:@"BPM: %.1f\nSố beat: %lu\n\nHaptic sync sẽ rung theo từng beat khi phát nhạc.", bpm, (unsigned long)beats.count];
                          [self showAlert:@"Bắt nhịp xong" msg:msg];
                          [self startHapticSync];
                      }
                  }];
              }
          }

          - (void)startHapticSync {
              if (!gCurrentPlayer || !gDetectedBeats) return;
              if (gTimeObserver) {
                  [gCurrentPlayer removeTimeObserver:gTimeObserver];
                  gTimeObserver = nil;
              }
              NSArray *beats = gDetectedBeats;
              __block NSInteger lastIdx = -1;
              gTimeObserver = [gCurrentPlayer addPeriodicTimeObserverForInterval:CMTimeMake(1, 30) queue:dispatch_get_main_queue() usingBlock:^(CMTime time) {
                  double t = CMTimeGetSeconds(time);
                  for (NSInteger i = 0; i < (NSInteger)beats.count; i++) {
                      double bt = beats[i].doubleValue;
                      if (bt > t - 0.05 && bt <= t + 0.05 && i != lastIdx) {
                          lastIdx = i;
                          UIImpactFeedbackGenerator *g = [[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleLight];
                          [g prepare];
                          [g impactOccurred];
                          break;
                      }
                  }
              }];
          }

          - (void)showAlert:(NSString *)title msg:(NSString *)msg {
              UIAlertController *al = [UIAlertController alertControllerWithTitle:title message:msg preferredStyle:UIAlertControllerStyleAlert];
              [al addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
              UIWindow *win = nil;
              for (UIWindow *w in [UIApplication sharedApplication].windows) {
                  if (!w.hidden && w.rootViewController && w != gOverlayWindow) {
                      win = w;
                      break;
                  }
              }
              UIViewController *root = win.rootViewController;
              if (root) [root presentViewController:al animated:YES completion:nil];
          }
          - (void)closeTapped { [self removeFromSuperview]; }
          @end

          // ==========================================
          // LOGO
          // ==========================================
          @interface VladLogoView : UIView
          - (void)logoTapped;
          - (void)logoPanned:(UIPanGestureRecognizer *)pan;
          @end
          @implementation VladLogoView
          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (self) {
                  self.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.08 alpha:0.9];
                  self.layer.cornerRadius = frame.size.width / 2;
                  self.layer.borderWidth = 1.5;
                  self.layer.borderColor = [UIColor colorWithRed:0.0 green:0.8 blue:1.0 alpha:1.0].CGColor;
                  self.layer.shadowColor = [UIColor colorWithRed:0.0 green:0.8 blue:1.0 alpha:1.0].CGColor;
                  self.layer.shadowRadius = 10;
                  self.layer.shadowOpacity = 1.0;
                  self.layer.shadowOffset = CGSizeZero;
                  UIImageView *logo = [[UIImageView alloc] initWithImage:[VladIcons vLogoWithSize:40 color:[UIColor whiteColor]]];
                  logo.center = CGPointMake(frame.size.width/2, frame.size.height/2);
                  [self addSubview:logo];
                  UITapGestureRecognizer *tap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(logoTapped)];
                  [self addGestureRecognizer:tap];
                  UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(logoPanned:)];
                  [self addGestureRecognizer:pan];
              }
              return self;
          }
          - (void)logoTapped {
              UIWindow *win = [UIApplication sharedApplication].keyWindow;
              VladMenuView *menu = [[VladMenuView alloc] initWithFrame:win.bounds];
              [win addSubview:menu];
          }
          - (void)logoPanned:(UIPanGestureRecognizer *)pan {
              CGPoint translation = [pan translationInView:self.superview];
              self.center = CGPointMake(self.center.x + translation.x, self.center.y + translation.y);
              [pan setTranslation:CGPointZero inView:self.superview];
          }
          @end

          // ==========================================
          // HOOKS
          // ==========================================
          %hook PHPickerViewController
          - (void)picker:(PHPickerViewController *)picker didFinishPicking:(NSArray<PHPickerResult *> *)results {
              %orig;
              @try {
                  if (results.count > 0) {
                      NSItemProvider *provider = results.firstObject.itemProvider;
                      if ([provider canLoadObjectOfClass:[UIImage class]]) {
                          [provider loadObjectOfClass:[UIImage class] completionHandler:^(id<NSItemProviderReading> _Nullable image, NSError * _Nullable error) {
                              if (image) {
                                  gLastQRImage = (UIImage *)image;
                                  dispatch_async(dispatch_get_main_queue(), ^{
                                      autoFillSmart(gCurrentEditor);
                                  });
                              }
                          }];
                      }
                  }
              } @catch (NSException *e) {}
          }
          %end

          %hook UIViewController
          - (void)viewDidLoad {
              %orig;
              NSString *cls = NSStringFromClass([self class]);
              if ([cls containsString:@"MultiLayerWizEffectVC"] || [cls containsString:@"Editor"]) {
                  gCurrentEditor = self;
              }
          }
          %end

          %hook AVPlayer
          - (void)play {
              %orig;
              gCurrentPlayer = self;
              AVPlayerItem *item = self.currentItem;
              if (item && [item.asset isKindOfClass:[AVURLAsset class]]) {
                  gCurrentAudioURL = ((AVURLAsset *)item.asset).URL;
              }
          }
          %end

          %hook AVAudioPlayer
          - (instancetype)initWithContentsOfURL:(NSURL *)url error:(NSError **)error {
              id r = %orig;
              if (r && url) gCurrentAudioURL = url;
              return r;
          }
          - (BOOL)play {
              BOOL r = %orig;
              if (self.url) gCurrentAudioURL = self.url;
              return r;
          }
          %end

          static void autoFillSmart(UIViewController *editor) {
              if (!editor || !gLastQRImage) return;
              @try {
                  NSMutableArray *imageViews = [NSMutableArray array];
                  searchImageViews(editor.view, imageViews);
                  for (UIImageView *iv in imageViews) {
                      if (iv.bounds.size.width > 40 && iv.bounds.size.height > 40 && iv.tag != 888) {
                          iv.image = gLastQRImage;
                      }
                  }
              } @catch (NSException *e) {}
          }

          static void searchImageViews(UIView *parent, NSMutableArray *array) {
              for (UIView *sub in parent.subviews) {
                  if ([sub isKindOfClass:[UIImageView class]]) [array addObject:sub];
                  searchImageViews(sub, array);
              }
          }

          %ctor {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.5 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  if (!gOverlayWindow) {
                      gOverlayWindow = [[VSPassthroughWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                      gOverlayWindow.windowLevel = UIWindowLevelAlert + 10;
                      gOverlayWindow.backgroundColor = [UIColor clearColor];
                      gOverlayWindow.rootViewController = [[UIViewController alloc] init];
                      gOverlayWindow.rootViewController.view.backgroundColor = [UIColor clearColor];
                      gOverlayWindow.hidden = NO;
                      VladLogoView *logo = [[VladLogoView alloc] initWithFrame:CGRectMake([UIScreen mainScreen].bounds.size.width - 70, 150, 60, 60)];
                      [gOverlayWindow.rootViewController.view addSubview:logo];
                  }
              });
          }
          TWEAKEOF

      - name: Build
        run: |
          make clean || true
          make -j1 VERBOSE=1 2>&1 | tee build.log
          test -f build.log && echo "=== build xong ==="

      - name: Verify
        run: |
          echo "=== dylib ==="
          find .theos/obj -name "*.dylib" -type f -exec ls -la {} \;
          test -n "$(find .theos/obj -name '*.dylib' -type f)" || (echo "KHÔNG có dylib!" && exit 1)

      - name: Package .deb
        run: make package FINALPACKAGE=1

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: VladTool-dylib
          path: .theos/obj/**/*.dylib
          if-no-files-found: error

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: VladTool-deb
          path: packages/*.deb
          if-no-files-found: warn

      - name: Upload build log nếu fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
