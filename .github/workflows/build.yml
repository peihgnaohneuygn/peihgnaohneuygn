name: Build Vlad Dump
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          $THEOS/bin/update-theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Tải SDK
        run: |
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/iPhoneOS14.5.sdk $THEOS/sdks/

      - name: Setup Tools (ldid & dpkg)
        run: |
          brew install ldid dpkg

      - name: Tạo Build Files
        run: |
          cat << 'EOF' > Makefile
          ARCHS = arm64 arm64e
          TARGET = iphone:clang:latest:14.0
          include $(THEOS)/makefiles/common.mk
          LIBRARY_NAME = VladAuto
          VladAuto_FILES = Tweak.mm
          VladAuto_FRAMEWORKS = UIKit Foundation
          VladAuto_CFLAGS = -fobjc-arc -Wno-everything -std=c++17
          VladAuto_CCFLAGS = -std=c++17
          include $(THEOS_MAKE_PATH)/library.mk
          EOF

          cat << 'TWEAKEOF' > Tweak.mm
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>

          @interface VladDumpManager : NSObject
          + (void)startDump;
          @end

          @implementation VladDumpManager
          + (void)startDump {
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                  NSMutableString *log = [NSMutableString string];
                  [log appendString:@"=== VLAD FULL DUMP ===\n\n"];

                  int numClasses = objc_getClassList(NULL, 0);
                  Class *classes = (__unsafe_unretained Class *)malloc(sizeof(Class) * numClasses);
                  numClasses = objc_getClassList(classes, numClasses);

                  for (int i = 0; i < numClasses; i++) {
                      Class cls = classes[i];
                      NSString *clsName = NSStringFromClass(cls);
                      
                      // Chỉ lấy class của Video Star hoặc các class liên quan đến Editor/Layer/Scene
                      if ([clsName hasPrefix:@"VS"] || [clsName containsString:@"Editor"] || [clsName containsString:@"Layer"] || [clsName containsString:@"Scene"] || [clsName containsString:@"Media"]) {
                          [log appendFormat:@"\n@interface %@\n", clsName];
                          
                          unsigned int methodCount;
                          Method *methods = class_copyMethodList(cls, &methodCount);
                          for (int j = 0; j < methodCount; j++) {
                              [log appendFormat:@"- (%s)%s\n", 
                                  method_copyReturnType(methods[j]), 
                                  sel_getName(method_getName(methods[j]))];
                          }
                          free(methods);
                          [log appendString:@"@end\n"];
                      }
                  }
                  free(classes);

                  dispatch_async(dispatch_get_main_queue(), ^{
                      // Tạo màn hình hiển thị code
                      UIViewController *textVC = [[UIViewController alloc] init];
                      textVC.view.backgroundColor = [UIColor blackColor];
                      
                      UITextView *tv = [[UITextView alloc] initWithFrame:CGRectMake(0, 50, textVC.view.bounds.size.width, textVC.view.bounds.size.height - 100)];
                      tv.text = log;
                      tv.textColor = [UIColor greenColor];
                      tv.backgroundColor = [UIColor blackColor];
                      tv.font = [UIFont fontWithName:@"Courier" size:10];
                      tv.editable = NO;
                      [textVC.view addSubview:tv];
                      
                      // Nút Copy
                      UIButton *copyBtn = [UIButton buttonWithType:UIButtonTypeCustom];
                      copyBtn.frame = CGRectMake(20, 10, 150, 40);
                      [copyBtn setTitle:@"COPY TOÀN BỘ" forState:UIControlStateNormal];
                      copyBtn.backgroundColor = [UIColor greenColor];
                      [copyBtn setTitleColor:[UIColor blackColor] forState:UIControlStateNormal];
                      copyBtn.layer.cornerRadius = 8;
                      [copyBtn addTarget:gOverlayWindow.rootViewController action:NSSelectorFromString(@"dummy") forControlEvents:UIControlEventTouchUpInside];
                      // Gắn action bằng block
                      [copyBtn addAction:[UIAction actionWithHandler:^(__kindof UIAction * _Nonnull action) {
                          [UIPasteboard generalPasteboard].string = log;
                          UIAlertController *al = [UIAlertController alertControllerWithTitle:@"Đã Copy" message:@"Mày dán vào chat cho tao nhé!" preferredStyle:UIAlertControllerStyleAlert];
                          [al addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                          [textVC presentViewController:al animated:YES completion:nil];
                      }] forControlEvents:UIControlEventTouchUpInside];
                      [textVC.view addSubview:copyBtn];
                      
                      // Nút Đóng
                      UIButton *closeBtn = [UIButton buttonWithType:UIButtonTypeCustom];
                      closeBtn.frame = CGRectMake(textVC.view.bounds.size.width - 100, 10, 80, 40);
                      [closeBtn setTitle:@"ĐÓNG" forState:UIControlStateNormal];
                      closeBtn.backgroundColor = [UIColor redColor];
                      [closeBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                      closeBtn.layer.cornerRadius = 8;
                      [closeBtn addAction:[UIAction actionWithHandler:^(__kindof UIAction * _Nonnull action) {
                          [textVC dismissViewControllerAnimated:YES completion:nil];
                      }] forControlEvents:UIControlEventTouchUpInside];
                      [textVC.view addSubview:closeBtn];
                      
                      UIWindow *win = [UIApplication sharedApplication].windows.firstObject;
                      [win.rootViewController presentViewController:textVC animated:YES completion:nil];
                  });
              });
          }
          @end

          __attribute__((constructor))
          static void initVlad() {
              @autoreleasepool {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      [VladDumpManager startDump];
                  });
              }
          }
          TWEAKEOF

      - name: Build
        run: |
          set -o pipefail
          make clean || true
          make -j1 VERBOSE=1 2>&1 | tee build.log
          DYLIB_PATH=$(find .theos/obj -name "VladAuto.dylib" -type f | head -n 1)
          mkdir -p output
          cp "$DYLIB_PATH" output/vlad_dump.dylib
          install_name_tool -id "@rpath/vlad_dump.dylib" output/vlad_dump.dylib
          ldid -S output/vlad_dump.dylib

      - name: Upload Vlad Dylib
        uses: actions/upload-artifact@v4
        with:
          name: vlad_dump
          path: output/vlad_dump.dylib
          if-no-files-found: error
