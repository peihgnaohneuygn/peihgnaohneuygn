          // ═══════════ VC HIERARCHY WALK ═══════════
          static UIViewController *FindVCInHierarchy(UIViewController *root, BOOL(^matcher)(NSString *cls)) {
              if (!root || !matcher) return nil;
              NSString *cls = NSStringFromClass([root class]);
              if (matcher(cls)) return root;

              if ([root isKindOfClass:[UINavigationController class]]) {
                  for (UIViewController *c in ((UINavigationController *)root).viewControllers) {
                      UIViewController *f = FindVCInHierarchy(c, matcher);
                      if (f) return f;
                  }
              }
              if ([root isKindOfClass:[UITabBarController class]]) {
                  for (UIViewController *c in ((UITabBarController *)root).viewControllers) {
                      UIViewController *f = FindVCInHierarchy(c, matcher);
                      if (f) return f;
                  }
              }
              for (UIViewController *c in root.childViewControllers) {
                  UIViewController *f = FindVCInHierarchy(c, matcher);
                  if (f) return f;
              }
              if (root.presentedViewController)
                  return FindVCInHierarchy(root.presentedViewController, matcher);
              return nil;
          }

          static UIViewController *CurrentKeyVC(void) {
              UIWindow *kw = nil;
              if (@available(iOS 13.0, *)) {
                  for (UIScene *s in [UIApplication sharedApplication].connectedScenes) {
                      if (s.activationState != UISceneActivationStateForegroundActive) continue;
                      if ([s isKindOfClass:[UIWindowScene class]]) {
                          for (UIWindow *w in ((UIWindowScene *)s).windows) {
                              if (!w.hidden && w != gOverlayWindow &&
                                  w.windowLevel == UIWindowLevelNormal) { kw = w; break; }
                          }
                      }
                      if (kw) break;
                  }
              }
              if (!kw) kw = [UIApplication sharedApplication].keyWindow;
              return kw.rootViewController;
          }

          static UIViewController *FindEditor(void) {
              if (gCurrentEditor && gCurrentEditor.view.window) return gCurrentEditor;
              return FindVCInHierarchy(CurrentKeyVC(), ^BOOL(NSString *c) {
                  return [c containsString:@"MultiLayerWizEffectVC"];
              });
          }

          static UIViewController *FindSplitVC(void) {
              if (gCurrentSplitVC && gCurrentSplitVC.view.window) return gCurrentSplitVC;
              return FindVCInHierarchy(CurrentKeyVC(), ^BOOL(NSString *c) {
                  return [c containsString:@"VideoReviewEditVC"];
              });
          }

