name: Build Vlad Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v3

    - name: Cài đặt Theos và iOS SDK
      run: |
        # 1. Clone Theos đầy đủ các submodule
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV

        # 2. Tải các bản iOS SDK chính thức để Theos không bị lỗi thiếu SDK
        mkdir -p $HOME/theos/sdks
        git clone https://github.com/theos/sdks.git $HOME/temp_sdks
        cp -r $HOME/temp_sdks/*.sdk $HOME/theos/sdks/
        rm -rf $HOME/temp_sdks

    - name: Cài đặt công cụ đóng gói (ldid, dpkg)
      run: |
        brew install ldid dpkg

    - name: Biên dịch Dylib
      run: |
        make clean
        make package FINALPACKAGE=1

    - name: Lưu trữ file vlad.dylib để tải về
      uses: actions/upload-artifact@v4
      with:
        name: vlad.dylib
        path: .theos/obj/debug/vlad.dylib
