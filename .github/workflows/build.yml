name: Build Vlad Tool Video Star

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Download iOS SDK 16.5
        run: |
          set -e
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          # Lấy SDK 16.5 (đã được cập nhật thay cho 16.4)
          cp -R /tmp/sdks/iPhoneOS16.5.sdk $THEOS/sdks/
          ls -la $THEOS/sdks/

      - name: Create Makefile & Tweak.mm
        run: |
          cat > Makefile << 'MAKEEOF'
          ARCHS = arm64 arm64e
          TARGET = iphone:clang:16.5:14.0
          include $(THEOS)/makefiles/common.mk

          LIBRARY_NAME = VladAuto
          VladAuto_FILES = Tweak.mm
          VladAuto_FRAMEWORKS = UIKit Foundation AVFoundation Photos PhotosUI QuartzCore CoreMedia AudioToolbox UniformTypeIdentifiers
          
          VladAuto_CFLAGS  = -fobjc-arc -w -stdlib=libc++ -I$(THEOS)/sdks/iPhoneOS16.5.sdk/usr/include/c++/v1
          VladAuto_CCFLAGS = -fobjc-arc -w -std=c++17 -stdlib=libc++ -I$(THEOS)/sdks/iPhoneOS16.5.sdk/usr/include/c++/v1
          VladAuto_USE_MODULES = 0
          VladAuto_LDFLAGS = -stdlib=libc++

          include $(THEOS_MAKE_PATH)/library.mk
          MAKEEOF

          cat > Tweak.mm << 'TWEAKEOF'
          #import <UIKit/UIKit.h>
          #import <AVFoundation/AVFoundation.h>
          #import <Photos/Photos.h>
          #import <PhotosUI/PhotosUI.h>
          #import <QuartzCore/QuartzCore.h>
          #import <objc/runtime.h>
          #import <objc/message.h>
          #import <CoreMedia/CoreMedia.h>
          #import <AudioToolbox/AudioToolbox.h>
          #import <UniformTypeIdentifiers/UniformTypeIdentifiers.h>

          // ═══════════ FORWARD DECLS (THEO ĐÚNG DUMP) ═══════════
          @interface MeterAndBPMModel : NSObject
          + (instancetype)sharedInstance;
          - (NSArray *)beatFrameOffsetsForScene:(NSInteger)scene project:(id)project;
          - (NSArray *)beatFrameOffsetsForBPM:(double)bpm firstBeatTime:(double)fbt duration:(double)duration startOffset:(double)offset;
          + (NSDictionary *)bpmAndFirstBeatTimeFromAudioFileAtPath:(NSString *)path;
          @end

          @interface QRCodeManager : NSObject
          + (instancetype)sharedInstance;
          - (void)selectedCode:(id)code withImageData:(NSData *)data;
          @end

          @interface MultiLayerImageGenerator : NSObject
          - (void)loadImageAsset:(id)asset;
          @end

          // ═══════════ GLOBALS ═══════════
          static UIImage  *gLastQRImage = nil;
          static NSString *gLastQRCode  = nil;
          static UIWindow *gOverlayWindow = nil;
          static UIViewController *gCurrentEditor   = nil;
          static UIViewController *gCurrentSplitVC  = nil;
          static BOOL gIsAutoFillMode = NO;
          static BOOL gOverlayInitialized = NO;

          static UIImpactFeedbackGenerator *gHapticGen = nil;
          static AVPlayer *gAudioPlayer = nil;
          static id gTimeObserver = nil;
          static NSArray<NSNumber *> *gBeatSeconds = nil;

          // ═══════════ FILE HELPERS ═══════════
          static NSString *VladQRDir(void) {
              static NSString *dir = nil;
              static dispatch_once_t once;
              dispatch_once(&once, ^{
                  dir = [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES).firstObject
                         stringByAppendingPathComponent:@"VladQR"];
                  [[NSFileManager defaultManager] createDirectoryAtPath:dir
                                            withIntermediateDirectories:YES attributes:nil error:nil];
              });
              return dir;
          }
          static void VladSaveQR(UIImage *img, NSString *code) {
              if (!img) return;
              [UIImagePNGRepresentation(img) writeToFile:
                  [VladQRDir() stringByAppendingPathComponent:@"last_qr.png"] atomically:YES];
              if (code) [code writeToFile:
                  [VladQRDir() stringByAppendingPathComponent:@"last_code.txt"]
                                     atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static UIImage *VladLoadQRImage(void) {
              return [UIImage imageWithContentsOfFile:
                      [VladQRDir() stringByAppendingPathComponent:@"last_qr.png"]];
          }
          static NSString *VladLoadQRCode(void) {
              return [NSString stringWithContentsOfFile:
                      [VladQRDir() stringByAppendingPathComponent:@"last_code.txt"]
                                              encoding:NSUTF8StringEncoding error:nil];
          }

          // ═══════════ UI HELPERS ═══════════
          @interface VladUI : NSObject
          + (UIColor *)neonGreen;
          + (UIImage *)icon:(NSString *)name size:(CGFloat)size color:(UIColor *)color;
          @end
          @implementation VladUI
          + (UIColor *)neonGreen { return [UIColor colorWithRed:0.1 green:1.0 blue:0.2 alpha:1.0]; }
          + (UIImage *)icon:(NSString *)name size:(CGFloat)size color:(UIColor *)color {
              if (@available(iOS 13.0, *)) {
                  UIImage *img = [UIImage systemImageNamed:name];
                  UIImageSymbolConfiguration *cfg =
                      [UIImageSymbolConfiguration configurationWithPointSize:size weight:UIImageSymbolWeightBold];
                  return [[img imageWithConfiguration:cfg] imageWithTintColor:color
                                                             renderingMode:UIImageRenderingModeAlwaysOriginal];
              }
              return nil;
          }
          @end

          @interface VSPassthroughWindow : UIWindow
          @end
          @implementation VSPassthroughWindow
          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              UIView *hit = [super hitTest:point withEvent:event];
              if (hit == self || hit == self.rootViewController.view) return nil;
              return hit;
          }
          @end

          // ═══════════ APPLY IMAGE TO ALL LAYERS ═══════════
          static NSInteger ApplyImageToAllLayers(UIViewController *editor, UIImage *image) {
              if (!editor || !image) return -1;
              NSInteger applied = 0;
              @try {
                  id engine = nil;
                  if ([editor respondsToSelector:NSSelectorFromString(@"engine")])
                      engine = ((id (*)(id, SEL))objc_msgSend)(editor, NSSelectorFromString(@"engine"));
                  if (!engine) @try { engine = [editor valueForKey:@"engine"]; } @catch (NSException *e) {}
                  if (!engine) { NSLog(@"[Vlad] engine nil"); return -1; }

                  NSArray *layers = nil;
                  if ([engine respondsToSelector:NSSelectorFromString(@"masterLayers")])
                      layers = ((id (*)(id, SEL))objc_msgSend)(engine, NSSelectorFromString(@"masterLayers"));
                  if (!layers) @try { layers = [engine valueForKey:@"masterLayers"]; } @catch (NSException *e) {}
                  if (!layers) { NSLog(@"[Vlad] masterLayers nil"); return -1; }

                  for (id layer in layers) {
                      @try {
                          id imageGen = nil;
                          if ([layer respondsToSelector:NSSelectorFromString(@"imageGenerator")])
                              imageGen = ((id (*)(id, SEL))objc_msgSend)(layer, NSSelectorFromString(@"imageGenerator"));
                          if (!imageGen) @try { imageGen = [layer valueForKey:@"imageGenerator"]; } @catch (NSException *e) {}
                          if (!imageGen) continue;

                          unsigned long long colorMode = 0;
                          if ([layer respondsToSelector:NSSelectorFromString(@"colorEffectMode")])
                              colorMode = ((unsigned long long (*)(id, SEL))objc_msgSend)(layer,
                                          NSSelectorFromString(@"colorEffectMode"));
                          if (colorMode > 0) continue;

                          [imageGen setValue:image forKey:@"layerImage"];
                          if ([imageGen respondsToSelector:NSSelectorFromString(@"newPhotoNotification:")])
                              ((void (*)(id, SEL, id))objc_msgSend)(imageGen,
                                  NSSelectorFromString(@"newPhotoNotification:"), nil);
                          applied++;
                      } @catch (NSException *e) {}
                  }
                  NSLog(@"[Vlad] Đã áp dụng %ld layer", (long)applied);

                  if ([editor respondsToSelector:NSSelectorFromString(@"updatePreview")]) {
                      ((void (*)(id, SEL))objc_msgSend)(editor, NSSelectorFromString(@"updatePreview"));
                  } else if ([editor respondsToSelector:NSSelectorFromString(@"updateDisplayAtFrame:")]) {
                      unsigned long long f = 0;
                      ((void (*)(id, SEL, unsigned long long))objc_msgSend)(editor,
                          NSSelectorFromString(@"updateDisplayAtFrame:"), f);
                  }
              } @catch (NSException *e) { NSLog(@"[Vlad] Apply error: %@", e.reason); }
              return applied;
          }

          // ═══════════ BEAT DETECTOR ═══════════
          @interface VladBeatDetector : NSObject
          + (void)detectFromProject:(id)project
                              scene:(NSInteger)sceneIndex
                         completion:(void(^)(double bpm, NSArray<NSValue *> *times, NSError *error))completion;
          @end

          @implementation VladBeatDetector
          + (NSArray<NSValue *> *)convertFramesToTimes:(NSArray *)frames frameRate:(double)frameRate {
              if (!frames || frames.count == 0) return nil;
              NSMutableArray *times = [NSMutableArray array];
              for (id val in frames) {
                  double f = 0;
                  if ([val isKindOfClass:[NSNumber class]]) f = [val doubleValue];
                  else @try { f = [[val valueForKey:@"doubleValue"] doubleValue]; } @catch (NSException *e) {}
                  double sec = f / frameRate;
                  if (sec > 0.05) {
                      CMTime t = CMTimeMakeWithSeconds(sec, 600);
                      [times addObject:[NSValue valueWithBytes:&t objCType:@encode(CMTime)]];
                  }
              }
              return times.count > 0 ? times : nil;
          }

          + (void)detectFromProject:(id)project scene:(NSInteger)sceneIndex
                         completion:(void(^)(double, NSArray<NSValue *> *, NSError *))completion {
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  NSError *err = nil;
                  NSArray<NSValue *> *times = nil;
                  double bpm = 0;
                  @try {
                      double frameRate = 30.0;
                      @try { frameRate = [[project valueForKey:@"frameRate"] doubleValue]; } @catch (NSException *e) {}
                      if (frameRate <= 0) frameRate = 30.0;

                      double songBPM = 0, songFBT = 0, songDuration = 0;
                      @try {
                          songBPM      = [[project valueForKey:@"songBPM"] doubleValue];
                          songFBT      = [[project valueForKey:@"songFirstBeatTime"] doubleValue];
                          songDuration = [[project valueForKey:@"songDuration"] doubleValue];
                      } @catch (NSException *e) {}

                      Class MeterClass = NSClassFromString(@"MeterAndBPMModel");
                      id meter = nil;
                      if (MeterClass && [MeterClass respondsToSelector:@selector(sharedInstance)])
                          meter = ((id (*)(id, SEL))objc_msgSend)(MeterClass, @selector(sharedInstance));

                      if (songBPM > 0 && songFBT >= 0 && songDuration > 0 && meter) {
                          SEL sel = NSSelectorFromString(@"beatFrameOffsetsForBPM:firstBeatTime:duration:startOffset:");
                          if ([meter respondsToSelector:sel]) {
                              NSArray *fr = ((id (*)(id, SEL, double, double, double, double))objc_msgSend)(
                                  meter, sel, songBPM, songFBT, songDuration, 0);
                              times = [self convertFramesToTimes:fr frameRate:frameRate];
                              if (times) bpm = songBPM;
                          }
                      }

                      if (!times && meter) {
                          SEL sel = NSSelectorFromString(@"beatFrameOffsetsForScene:project:");
                          if ([meter respondsToSelector:sel]) {
                              NSArray *fr = ((id (*)(id, SEL, NSInteger, id))objc_msgSend)(meter, sel, sceneIndex, project);
                              times = [self convertFramesToTimes:fr frameRate:frameRate];
                              if (times) @try { bpm = [[project valueForKey:@"songBPM"] doubleValue]; } @catch (NSException *e) {}
                          }
                      }

                      if (!times && meter) {
                          NSURL *audioURL = nil;
                          @try {
                              id fm = [project valueForKey:@"fileManager"];
                              if (fm && [fm respondsToSelector:@selector(trimmedSongURL)])
                                  audioURL = ((id (*)(id, SEL))objc_msgSend)(fm, @selector(trimmedSongURL));
                              if (!audioURL && fm && [fm respondsToSelector:@selector(songURL)])
                                  audioURL = ((id (*)(id, SEL))objc_msgSend)(fm, @selector(songURL));
                          } @catch (NSException *e) {}

                          SEL selA = NSSelectorFromString(@"bpmAndFirstBeatTimeFromAudioFileAtPath:");
                          NSDictionary *res = nil;
                          if (audioURL) {
                              if (MeterClass && [MeterClass respondsToSelector:selA])
                                  res = ((id (*)(id, SEL, NSString *))objc_msgSend)(MeterClass, selA, audioURL.path);
                              else if ([meter respondsToSelector:selA])
                                  res = ((id (*)(id, SEL, NSString *))objc_msgSend)(meter, selA, audioURL.path);
                          }
                          if ([res isKindOfClass:[NSDictionary class]]) {
                              double dBPM = [[res valueForKey:@"bpm"] doubleValue];
                              double dFBT = [[res valueForKey:@"firstBeatTime"] doubleValue];
                              if (dBPM > 0) {
                                  SEL selF = NSSelectorFromString(@"beatFrameOffsetsForBPM:firstBeatTime:duration:startOffset:");
                                  if ([meter respondsToSelector:selF]) {
                                      NSArray *fr = ((id (*)(id, SEL, double, double, double, double))objc_msgSend)(
                                          meter, selF, dBPM, dFBT, songDuration, 0);
                                      times = [self convertFramesToTimes:fr frameRate:frameRate];
                                      if (times) bpm = dBPM;
                                  }
                              }
                          }
                      }

                      if (!times) err = [NSError errorWithDomain:@"Vlad" code:2
                          userInfo:@{NSLocalizedDescriptionKey:
                              @"Không bóc được beat từ project này.\n\n"
                              @"Nguyên nhân thường gặp:\n"
                              @"• Project chưa import nhạc (qua Song Picker)\n"
                              @"• Nhạc quá ngắn (< 5 giây)\n"
                              @"• Nhạc silent / không có nhịp rõ ràng"}];
                  } @catch (NSException *e) {
                      err = [NSError errorWithDomain:@"Vlad" code:99
                          userInfo:@{NSLocalizedDescriptionKey: e.reason ?: @"Lỗi"}];
                  }
                  dispatch_async(dispatch_get_main_queue(), ^{ completion(bpm, times, err); });
              });
          }
          @end

          // ═══════════ SPLIT SCENE ═══════════
          static void SplitSceneWithTimes(UIViewController *splitVC,
                                          NSArray<NSValue *> *times,
                                          void(^completion)(NSError *error, NSInteger splitCount)) {
              if (!splitVC || times.count == 0) {
                  if (completion) completion([NSError errorWithDomain:@"Vlad" code:1
                      userInfo:@{NSLocalizedDescriptionKey:@"Không có mốc thời gian"}], 0);
                  return;
              }
              @try {
                  id project = nil;
                  if ([splitVC respondsToSelector:@selector(project)])
                      project = ((id (*)(id, SEL))objc_msgSend)(splitVC, @selector(project));
                  if (!project) {
                      Class PM = NSClassFromString(@"Video_Star.ProjectManager")
                              ?: NSClassFromString(@"_TtC10Video_Star14ProjectManager")
                              ?: NSClassFromString(@"ProjectManager");
                      if (PM && [PM respondsToSelector:@selector(sharedInstance)]) {
                          id pm = ((id (*)(id, SEL))objc_msgSend)(PM, @selector(sharedInstance));
                          if ([pm respondsToSelector:@selector(activeEditProject)])
                              project = ((id (*)(id, SEL))objc_msgSend)(pm, @selector(activeEditProject));
                      }
                  }
                  if (!project) {
                      if (completion) completion([NSError errorWithDomain:@"Vlad" code:2
                          userInfo:@{NSLocalizedDescriptionKey:@"Không tìm được project"}], 0);
                      return;
                  }

                  unsigned long long sceneIndex = 0;
                  if ([splitVC respondsToSelector:@selector(sceneIndex)])
                      sceneIndex = ((unsigned long long (*)(id, SEL))objc_msgSend)(splitVC, @selector(sceneIndex));

                  unsigned long long startCount = 0;
                  if ([project respondsToSelector:@selector(sceneCount)])
                      startCount = ((unsigned long long (*)(id, SEL))objc_msgSend)(project, @selector(sceneCount));

                  SEL sel = NSSelectorFromString(@"multiSplitSceneAtIndex:times:progressView:completion:");
                  if (![project respondsToSelector:sel]) {
                      if (completion) completion([NSError errorWithDomain:@"Vlad" code:3
                          userInfo:@{NSLocalizedDescriptionKey:@"Project không có multiSplit API"}], 0);
                      return;
                  }

                  NSMethodSignature *sig = [project methodSignatureForSelector:sel];
                  NSInvocation *inv = [NSInvocation invocationWithMethodSignature:sig];
                  [inv setTarget:project];
                  [inv setSelector:sel];
                  [inv setArgument:&sceneIndex atIndex:2];

                  NSArray *t = times;
                  [inv setArgument:&t atIndex:3];
                  id nilProgress = nil;
                  [inv setArgument:&nilProgress atIndex:4];

                  __block BOOL blockFired = NO;
                  void (^noop)(void) = ^{
                      blockFired = YES;
                      NSLog(@"[Vlad] multiSplit completion fired");
                  };
                  id cbHeap = [noop copy];
                  [inv setArgument:&cbHeap atIndex:5];

                  NSLog(@"[Vlad] Invoking multiSplit at scene %llu with %lu times",
                        sceneIndex, (unsigned long)times.count);
                  [inv invoke];

                  __block NSInteger polls = 0;
                  __block void (^checkSuccess)(void);
                  checkSuccess = ^{
                      if (blockFired) {
                          if (completion) completion(nil, (NSInteger)times.count);
                          return;
                      }
                      polls++;
                      if (polls > 200) {
                          if (completion) completion([NSError errorWithDomain:@"Vlad" code:99
                              userInfo:@{NSLocalizedDescriptionKey:
                                  @"Timeout sau 60s.\nCó thể đã xong - hãy kiểm tra app."}],
                                  (NSInteger)times.count);
                          return;
                      }
                      unsigned long long nowCount = 0;
                      if ([project respondsToSelector:@selector(sceneCount)])
                          nowCount = ((unsigned long long (*)(id, SEL))objc_msgSend)(project, @selector(sceneCount));
                      if (nowCount > startCount) {
                          if (completion) completion(nil, (NSInteger)times.count);
                          return;
                      }
                      dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.3 * NSEC_PER_SEC)),
                                     dispatch_get_main_queue(), checkSuccess);
                  };
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.3 * NSEC_PER_SEC)),
                                 dispatch_get_main_queue(), checkSuccess);
              } @catch (NSException *e) {
                  if (completion) completion([NSError errorWithDomain:@"Vlad" code:99
                      userInfo:@{NSLocalizedDescriptionKey: e.reason ?: @"Lỗi"}], 0);
              }
          }

          // ═══════════ HAPTIC SYNC ═══════════
          static void StopHapticSync(void) {
              if (gAudioPlayer && gTimeObserver) @try { [gAudioPlayer removeTimeObserver:gTimeObserver]; } @catch (NSException *e) {}
              gTimeObserver = nil;
              [gAudioPlayer pause];
              gAudioPlayer = nil;
              gBeatSeconds = nil;
              gHapticGen = nil;
          }
          static void StartHapticSync(NSArray<NSNumber *> *beats, NSURL *audioURL) {
              StopHapticSync();
              if (!audioURL || beats.count == 0) return;
              gHapticGen = [[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleMedium];
              [gHapticGen prepare];
              gAudioPlayer = [[AVPlayer alloc] initWithURL:audioURL];
              gBeatSeconds = beats;
              __block NSInteger lastIdx = -1;
              gTimeObserver = [gAudioPlayer addPeriodicTimeObserverForInterval:CMTimeMake(1, 30)
                                                                         queue:dispatch_get_main_queue()
                                                                    usingBlock:^(CMTime time) {
                  double t = CMTimeGetSeconds(time);
                  NSArray<NSNumber *> *b = gBeatSeconds;
                  if (!b) return;
                  for (NSInteger i = 0; i < (NSInteger)b.count; i++) {
                      double bt = [b[i] doubleValue];
                      if (bt > t - 0.05 && bt <= t + 0.05 && i != lastIdx) {
                          lastIdx = i;
                          [gHapticGen impactOccurred];
                          [gHapticGen prepare];
                          break;
                      }
                  }
              }];
              [gAudioPlayer play];
          }

          // ═══════════ QR PREVIEW VC ═══════════
          @interface VladQRPreviewVC : UIViewController
          @property (nonatomic, strong) UIImage *qrImage;
          @property (nonatomic, copy)   NSString *qrCode;
          - (instancetype)initWithImage:(UIImage *)image code:(NSString *)code;
          @end

          @implementation VladQRPreviewVC
          - (instancetype)initWithImage:(UIImage *)image code:(NSString *)code {
              if (self = [super init]) {
                  _qrImage = image; _qrCode = code;
                  self.modalPresentationStyle = UIModalPresentationOverFullScreen;
              }
              return self;
          }
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithWhite:0 alpha:0.95];

              UIImageView *iv = [[UIImageView alloc] initWithImage:self.qrImage];
              iv.contentMode = UIViewContentModeScaleAspectFit;
              iv.layer.cornerRadius = 14; iv.clipsToBounds = YES;
              iv.backgroundColor = [UIColor whiteColor];
              iv.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:iv];

              UILabel *title = [[UILabel alloc] init];
              title.text = @"QR Code Gần Nhất";
              title.textColor = [VladUI neonGreen];
              title.font = [UIFont boldSystemFontOfSize:20];
              title.textAlignment = NSTextAlignmentCenter;
              title.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:title];

              UILabel *codeLbl = [[UILabel alloc] init];
              codeLbl.text = self.qrCode ?: @"(không có mã)";
              codeLbl.textColor = [UIColor lightGrayColor];
              codeLbl.font = [UIFont systemFontOfSize:13];
              codeLbl.textAlignment = NSTextAlignmentCenter;
              codeLbl.numberOfLines = 3;
              codeLbl.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:codeLbl];

              UIStackView *stack = [[UIStackView alloc] init];
              stack.axis = UILayoutConstraintAxisHorizontal;
              stack.spacing = 12;
              stack.distribution = UIStackViewDistributionFillEqually;
              stack.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:stack];

              [stack addArrangedSubview:[self btn:@"Lưu Ảnh" icon:@"square.and.arrow.down" action:@selector(saveTapped)]];
              [stack addArrangedSubview:[self btn:@"Chia Sẻ" icon:@"square.and.arrow.up" action:@selector(shareTapped)]];

              UIButton *close = [UIButton buttonWithType:UIButtonTypeSystem];
              [close setTitle:@"ĐÓNG" forState:UIControlStateNormal];
              [close setTitleColor:[UIColor blackColor] forState:UIControlStateNormal];
              close.backgroundColor = [VladUI neonGreen];
              close.layer.cornerRadius = 22;
              close.titleLabel.font = [UIFont boldSystemFontOfSize:15];
              close.translatesAutoresizingMaskIntoConstraints = NO;
              [close addTarget:self action:@selector(closeTapped) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:close];

              [NSLayoutConstraint activateConstraints:@[
                  [title.topAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.topAnchor constant:20],
                  [title.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor constant:20],
                  [title.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor constant:-20],
                  [iv.topAnchor constraintEqualToAnchor:title.bottomAnchor constant:20],
                  [iv.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor constant:24],
                  [iv.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor constant:-24],
                  [iv.heightAnchor constraintEqualToAnchor:iv.widthAnchor],
                  [codeLbl.topAnchor constraintEqualToAnchor:iv.bottomAnchor constant:12],
                  [codeLbl.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor constant:24],
                  [codeLbl.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor constant:-24],
                  [stack.topAnchor constraintEqualToAnchor:codeLbl.bottomAnchor constant:20],
                  [stack.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor constant:24],
                  [stack.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor constant:-24],
                  [stack.heightAnchor constraintEqualToConstant:52],
                  [close.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor constant:24],
                  [close.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor constant:-24],
                  [close.bottomAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.bottomAnchor constant:-20],
                  [close.heightAnchor constraintEqualToConstant:44]
              ]];
          }
          - (UIButton *)btn:(NSString *)title icon:(NSString *)icon action:(SEL)action {
              UIButton *b = [UIButton buttonWithType:UIButtonTypeSystem];
              [b setTitle:title forState:UIControlStateNormal];
              [b setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              [b setImage:[VladUI icon:icon size:18 color:[UIColor whiteColor]] forState:UIControlStateNormal];
              b.tintColor = [UIColor whiteColor];
              b.titleLabel.font = [UIFont boldSystemFontOfSize:14];
              b.backgroundColor = [UIColor colorWithWhite:1 alpha:0.12];
              b.layer.cornerRadius = 12;
              b.imageEdgeInsets = UIEdgeInsetsMake(0, -6, 0, 6);
              [b addTarget:self action:action forControlEvents:UIControlEventTouchUpInside];
              return b;
          }
          - (void)saveTapped {
              UIImageWriteToSavedPhotosAlbum(self.qrImage, self, @selector(image:didFinishSavingWithError:context:), NULL);
          }
          - (void)image:(UIImage *)image didFinishSavingWithError:(NSError *)error context:(void *)ctx {
              NSString *msg = error ? @"Lưu thất bại. Kiểm tra quyền Photos." : @"Đã lưu vào ảnh!";
              UIAlertController *al = [UIAlertController alertControllerWithTitle:@"Thông báo" message:msg
                                                                  preferredStyle:UIAlertControllerStyleAlert];
