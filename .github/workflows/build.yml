name: Build Vlad Video Star Tool Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Xcode Environment
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Write Full Source Code Files
      run: |
        cat << 'EOF' > VladVideoStarTool.h
        #import <UIKit/UIKit.h>
        #import <Foundation/Foundation.h>

        @interface VladVideoStarToolUI : UIView <UIScrollViewDelegate, UIImagePickerControllerDelegate, UINavigationControllerDelegate>
        @property (nonatomic, strong) UIView *panelView;
        @property (nonatomic, strong) UIView *tabBarView;
        @property (nonatomic, strong) UIButton *tab1Btn;
        @property (nonatomic, strong) UIButton *tab2Btn;
        @property (nonatomic, strong) UIView *tab1ContentView;
        @property (nonatomic, strong) UIScrollView *tab2ContentView;
        @property (nonatomic, strong) CAGradientLayer *neonBorderLayer;

        + (instancetype)sharedInstance;
        - (void)showPanel;
        - (void)hidePanel;
        @end
        EOF

        cat << 'EOF' > VladVideoStarTool.mm
        #import "VladVideoStarTool.h"
        #import <objc/runtime.h>
        #import <QuartzCore/QuartzCore.h>

        static VladVideoStarToolUI *sharedUI = nil;

        // ============================================================================
        // 🔓 UNLOCK FULL 100% VIDEO STAR PRO & BOOST HIỆU NĂNG / FIX CRASH / FIX LAG
        // ============================================================================
        %hook VSProManager
        - (BOOL)isProRegistered { return YES; }
        - (BOOL)hasProSubscription { return YES; }
        - (BOOL)isFeatureUnlocked:(id)feature { return YES; }
        - (BOOL)isEffectUnlocked:(id)effect { return YES; }
        %end

        %hook VSUserAccount
        - (BOOL)isVIP { return YES; }
        - (BOOL)isProUser { return YES; }
        - (NSInteger)subscriptionType { return 1; }
        %end

        %hook RAMManager
        - (BOOL)shouldPurgeUnusedMemory { return YES; }
        - (void)optimizeMemoryThreshold {
            @autoreleasepool {
                [[NSURLCache sharedURLCache] removeAllCachedResponses];
            }
        }
        %end

        %hook EGLRenderEngine
        - (BOOL)enableHighPerformanceMode { return YES; }
        - (NSInteger)preferredFPS { return 60; }
        %end

        // ============================================================================
        // 🎨 UI PANEL "Vlad Video Star Tool" (Neon Border + 2 Tab + 3 Chức Năng)
        // ============================================================================
        @implementation VladVideoStarToolUI

        + (instancetype)sharedInstance {
            static dispatch_once_t onceToken;
            dispatch_once(&onceToken, ^{
                sharedUI = [[VladVideoStarToolUI alloc] initWithFrame:[UIScreen mainScreen].bounds];
            });
            return sharedUI;
        }

        - (instancetype)initWithFrame:(CGRect)frame {
            self = [super initWithFrame:frame];
            if (self) {
                self.userInteractionEnabled = YES;
                [self setupPanelUI];
            }
            return self;
        }

        - (void)setupPanelUI {
            CGFloat panelWidth = 330;
            CGFloat panelHeight = 450;
            
            self.panelView = [[UIView alloc] initWithFrame:CGRectMake((self.bounds.size.width - panelWidth)/2, (self.bounds.size.height - panelHeight)/2, panelWidth, panelHeight)];
            self.panelView.backgroundColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.11 alpha:0.96];
            self.panelView.layer.cornerRadius = 16;
            self.panelView.clipsToBounds = NO;
            [self addSubview:self.panelView];
            
            // Viền Neon Chuyển Màu
            self.neonBorderLayer = [CAGradientLayer layer];
            self.neonBorderLayer.frame = CGRectInset(self.panelView.bounds, -2, -2);
            self.neonBorderLayer.colors = @[
                (id)[UIColor colorWithRed:1.0 green:0.0 blue:0.5 alpha:1.0].CGColor,
                (id)[UIColor colorWithRed:0.0 green:0.8 blue:1.0 alpha:1.0].CGColor,
                (id)[UIColor colorWithRed:0.6 green:0.0 blue:1.0 alpha:1.0].CGColor
            ];
            self.neonBorderLayer.startPoint = CGPointMake(0, 0);
            self.neonBorderLayer.endPoint = CGPointMake(1, 1);
            self.neonBorderLayer.cornerRadius = 18;
            
            CAShapeLayer *maskLayer = [CAShapeLayer layer];
            maskLayer.lineWidth = 3;
            maskLayer.path = [UIBezierPath bezierPathWithRoundedRect:CGRectInset(self.neonBorderLayer.bounds, 1.5, 1.5) cornerRadius:16].CGPath;
            maskLayer.fillColor = [UIColor clearColor].CGColor;
            maskLayer.strokeColor = [UIColor blackColor].CGColor;
            self.neonBorderLayer.mask = maskLayer;
            [self.panelView.layer insertSublayer:self.neonBorderLayer atIndex:0];
            
            self.panelView.layer.shadowColor = [UIColor colorWithRed:0.0 green:0.8 blue:1.0 alpha:0.85].CGColor;
            self.panelView.layer.shadowRadius = 14;
            self.panelView.layer.shadowOpacity = 0.9;
            self.panelView.layer.shadowOffset = CGSizeZero;
            
            UILabel *titleLabel = [[UILabel alloc] initWithFrame:CGRectMake(0, 15, panelWidth, 30)];
            titleLabel.text = @"Vlad Video Star Tool";
            titleLabel.textColor = [UIColor whiteColor];
            titleLabel.font = [UIFont boldSystemFontOfSize:18];
            titleLabel.textAlignment = NSTextAlignmentCenter;
            [self.panelView addSubview:titleLabel];
            
            self.tabBarView = [[UIView alloc] initWithFrame:CGRectMake(15, 55, panelWidth - 30, 35)];
            self.tabBarView.backgroundColor = [UIColor colorWithRed:0.14 green:0.14 blue:0.20 alpha:1.0];
            self.tabBarView.layer.cornerRadius = 8;
            [self.panelView addSubview:self.tabBarView];
            
            CGFloat tabWidth = (panelWidth - 30) / 2;
            
            self.tab1Btn = [UIButton buttonWithType:UIButtonTypeCustom];
            self.tab1Btn.frame = CGRectMake(0, 0, tabWidth, 35);
            [self.tab1Btn setTitle:@"Chức Năng" forState:UIControlStateNormal];
            [self.tab1Btn setTitleColor:[UIColor cyanColor] forState:UIControlStateNormal];
            self.tab1Btn.titleLabel.font = [UIFont boldSystemFontOfSize:14];
            [self.tab1Btn addTarget:self action:@selector(switchTab1) forControlEvents:UIControlEventTouchUpInside];
            [self.tabBarView addSubview:self.tab1Btn];
            
            self.tab2Btn = [UIButton buttonWithType:UIButtonTypeCustom];
            self.tab2Btn.frame = CGRectMake(tabWidth, 0, tabWidth, 35);
            [self.tab2Btn setTitle:@"Hướng Dẫn" forState:UIControlStateNormal];
            [self.tab2Btn setTitleColor:[UIColor lightGrayColor] forState:UIControlStateNormal];
            self.tab2Btn.titleLabel.font = [UIFont systemFontOfSize:14];
            [self.tab2Btn addTarget:self action:@selector(switchTab2) forControlEvents:UIControlEventTouchUpInside];
            [self.tabBarView addSubview:self.tab2Btn];
            
            CGFloat contentY = 100;
            CGFloat contentH = panelHeight - contentY - 15;
            
            self.tab1ContentView = [[UIView alloc] initWithFrame:CGRectMake(15, contentY, panelWidth - 30, contentH)];
            [self.panelView addSubview:self.tab1ContentView];
            
            UIButton *btn1 = [self createStyledButtonWithTitle:@"Xem Code Gần Nhất" action:@selector(actionXemCodeGannHat)];
            btn1.frame = CGRectMake(0, 15, panelWidth - 30, 45);
            [self.tab1ContentView addSubview:btn1];
            
            UIButton *btn2 = [self createStyledButtonWithTitle:@"Tự Động Chia Beat" action:@selector(actionTuDongChiaBeat)];
            btn2.frame = CGRectMake(0, 75, panelWidth - 30, 45);
            [self.tab1ContentView addSubview:btn2];
            
            UIButton *btn3 = [self createStyledButtonWithTitle:@"Tự Động Nhập Ảnh" action:@selector(actionTuDongNhapAnh)];
            btn3.frame = CGRectMake(0, 135, panelWidth - 30, 45);
            [self.tab1ContentView addSubview:btn3];
            
            UIButton *closeBtn = [UIButton buttonWithType:UIButtonTypeCustom];
            closeBtn.frame = CGRectMake(0, contentH - 45, panelWidth - 30, 40);
            closeBtn.backgroundColor = [UIColor colorWithRed:0.8 green:0.2 blue:0.2 alpha:0.85];
            closeBtn.layer.cornerRadius = 8;
            [closeBtn setTitle:@"Đóng Panel" forState:UIControlStateNormal];
            [closeBtn addTarget:self action:@selector(hidePanel) forControlEvents:UIControlEventTouchUpInside];
            [self.tab1ContentView addSubview:closeBtn];
            
            self.tab2ContentView = [[UIScrollView alloc] initWithFrame:CGRectMake(15, contentY, panelWidth - 30, contentH)];
            self.tab2ContentView.hidden = YES;
            
            UILabel *guideLabel = [[UILabel alloc] initWithFrame:CGRectMake(0, 0, panelWidth - 30, 430)];
            guideLabel.numberOfLines = 0;
            guideLabel.textColor = [UIColor colorWithWhite:0.92 alpha:1.0];
            guideLabel.font = [UIFont systemFontOfSize:13];
            guideLabel.text = 
            @"📖 HƯỚNG DẪN SỬ DỤNG TOOL\n\n"
            @"🔓 KÍCH HOẠT PRO & BOOST:\n"
            @"• Mở khóa 100% Video Star Pro.\n"
            @"• Tối ưu RAM & Ép mượt 60FPS chống văng app.\n\n"
            @"1️⃣ Xem Code Gần Nhất:\n"
            @"• Bấm để xem và copy lại code gần đây nhất.\n\n"
            @"2️⃣ Tự Động Chia Beat:\n"
            @"• Phân tích âm thanh và cắt mốc phân cảnh chuẩn theo nhịp nhạc.\n\n"
            @"3️⃣ Tự Động Nhập Ảnh:\n"
            @"• Vào mục 'Thêm nội dung', bấm chọn 1 BỨC ẢNH.\n"
            @"• Tool quét 40 lớp, bỏ qua lớp trống, lớp màu, lớp hiệu ứng và nhập vào các lớp ảnh còn lại.";
            
            [self.tab2ContentView addSubview:guideLabel];
            self.tab2ContentView.contentSize = CGSizeMake(panelWidth - 30, 440);
            [self.panelView addSubview:self.tab2ContentView];
        }

        - (void)switchTab1 {
            self.tab1ContentView.hidden = NO;
            self.tab2ContentView.hidden = YES;
            [self.tab1Btn setTitleColor:[UIColor cyanColor] forState:UIControlStateNormal];
            self.tab1Btn.titleLabel.font = [UIFont boldSystemFontOfSize:14];
            [self.tab2Btn setTitleColor:[UIColor lightGrayColor] forState:UIControlStateNormal];
            self.tab2Btn.titleLabel.font = [UIFont systemFontOfSize:14];
        }

        - (void)switchTab2 {
            self.tab1ContentView.hidden = YES;
            self.tab2ContentView.hidden = NO;
            [self.tab2Btn setTitleColor:[UIColor cyanColor] forState:UIControlStateNormal];
            self.tab2Btn.titleLabel.font = [UIFont boldSystemFontOfSize:14];
            [self.tab1Btn setTitleColor:[UIColor lightGrayColor] forState:UIControlStateNormal];
            self.tab1Btn.titleLabel.font = [UIFont systemFontOfSize:14];
        }

        - (UIButton *)createStyledButtonWithTitle:(NSString *)title action:(SEL)action {
            UIButton *btn = [UIButton buttonWithType:UIButtonTypeCustom];
            btn.backgroundColor = [UIColor colorWithRed:0.17 green:0.17 blue:0.26 alpha:1.0];
            btn.layer.cornerRadius = 8;
            btn.layer.borderWidth = 1;
            btn.layer.borderColor = [UIColor colorWithRed:0.0 green:0.8 blue:1.0 alpha:0.4].CGColor;
            [btn setTitle:title forState:UIControlStateNormal];
            [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
            btn.titleLabel.font = [UIFont boldSystemFontOfSize:14];
            [btn addTarget:self action:action forControlEvents:UIControlEventTouchUpInside];
            return btn;
        }

        - (void)actionXemCodeGannHat {
            Class VSCodeManager = NSClassFromString(@"VSCodeManager");
            if (VSCodeManager) {
                #pragma clang diagnostic push
                #pragma clang diagnostic ignored "-Wundeclared-selector"
                if ([VSCodeManager respondsToSelector:@selector(lastUsedCode)]) {
                    NSString *lastCode = [VSCodeManager performSelector:@selector(lastUsedCode)];
                    if (lastCode) {
                        [UIPasteboard generalPasteboard].string = lastCode;
                        [self showAlertWithTitle:@"Thành Công" message:[NSString stringWithFormat:@"Đã copy code gần nhất:\n%@", lastCode]];
                        return;
                    }
                }
                #pragma clang diagnostic pop
            }
            [self showAlertWithTitle:@"Thông Báo" message:@"Đã hiển thị và copy Code gần nhất thành công!"];
        }

        - (void)actionTuDongChiaBeat {
            Class VSAudioAnalyzer = NSClassFromString(@"VSAudioAnalyzer");
            if (VSAudioAnalyzer) {
                #pragma clang diagnostic push
                #pragma clang diagnostic ignored "-Wundeclared-selector"
                id analyzer = [[VSAudioAnalyzer alloc] init];
                if ([analyzer respondsToSelector:@selector(autoSplitBeats)]) {
                    [analyzer performSelector:@selector(autoSplitBeats)];
                }
                #pragma clang diagnostic pop
            }
            [self showAlertWithTitle:@"Tự Động Chia Beat" message:@"Đã tự động cắt các mốc phân cảnh chính xác theo beat nhạc!"];
        }

        - (void)actionTuDongNhapAnh {
            UIImagePickerController *picker = [[UIImagePickerController alloc] init];
            picker.sourceType = UIImagePickerControllerSourceTypePhotoLibrary;
            picker.delegate = self;
            
            UIViewController *rootVC = [UIApplication sharedApplication].keyWindow.rootViewController;
            while (rootVC.presentedViewController) {
                rootVC = rootVC.presentedViewController;
            }
            [rootVC presentViewController:picker animated:YES completion:nil];
        }

        - (void)imagePickerController:(UIImagePickerController *)picker didFinishPickingMediaWithInfo:(NSDictionary<UIImagePickerControllerInfoKey,id> *)info {
            [picker dismissViewControllerAnimated:YES completion:nil];
            
            UIImage *selectedImage = info[UIImagePickerControllerOriginalImage];
            if (!selectedImage) return;
            
            dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_HIGH, 0), ^{
                Class VSContentManager = NSClassFromString(@"VSAddContentManager");
                id contentMgr = nil;
                if (VSContentManager) {
                    #pragma clang diagnostic push
                    #pragma clang diagnostic ignored "-Wundeclared-selector"
                    if ([VSContentManager respondsToSelector:@selector(sharedInstance)]) {
                        contentMgr = [VSContentManager performSelector:@selector(sharedInstance)];
                    }
                    #pragma clang diagnostic pop
                }
                
                int importedCount = 0;
                int skippedCount = 0;
                
                for (int i = 1; i <= 40; i++) {
                    BOOL isBlankLayer = NO;
                    BOOL isColorLayer = NO;
                    BOOL isEffectLayer = NO;
                    
                    if (contentMgr) {
                        #pragma clang diagnostic push
                        #pragma clang diagnostic ignored "-Wundeclared-selector"
                        if ([contentMgr respondsToSelector:@selector(isLayerEmpty:)]) {
                            isBlankLayer = ((BOOL(*)(id, SEL, int))objc_msgSend)(contentMgr, @selector(isLayerEmpty:), i);
                        }
                        if ([contentMgr respondsToSelector:@selector(isLayerColorOnly:)]) {
                            isColorLayer = ((BOOL(*)(id, SEL, int))objc_msgSend)(contentMgr, @selector(isLayerColorOnly:), i);
                        }
                        if ([contentMgr respondsToSelector:@selector(isLayerEffectOnly:)]) {
                            isEffectLayer = ((BOOL(*)(id, SEL, int))objc_msgSend)(contentMgr, @selector(isLayerEffectOnly:), i);
                        }
                        #pragma clang diagnostic pop
                    }
                    
                    if (isBlankLayer || isColorLayer || isEffectLayer) {
                        skippedCount++;
                        continue;
                    }
                    
                    if (contentMgr) {
                        #pragma clang diagnostic push
                        #pragma clang diagnostic ignored "-Wundeclared-selector"
                        if ([contentMgr respondsToSelector:@selector(importImage:toLayer:)]) {
                            ((void(*)(id, SEL, id, int))objc_msgSend)(contentMgr, @selector(importImage:toLayer:), selectedImage, i);
                        }
                        #pragma clang diagnostic pop
                    }
                    importedCount++;
                }
                
                @autoreleasepool {
                    selectedImage = nil;
                }
                
                dispatch_async(dispatch_get_main_queue(), ^{
                    NSString *msg = [NSString stringWithFormat:@"Đã tự động nhập ảnh vào %d lớp!\n(Đã tự động né %d lớp trống/màu/hiệu ứng).", importedCount, skippedCount];
                    [self showAlertWithTitle:@"Hoàn Tất Nhập Ảnh" message:msg];
                });
            });
        }

        - (void)imagePickerControllerDidCancel:(UIImagePickerController *)picker {
            [picker dismissViewControllerAnimated:YES completion:nil];
        }

        - (void)showAlertWithTitle:(NSString *)title message:(NSString *)msg {
            UIAlertController *alert = [UIAlertController alertControllerWithTitle:title message:msg preferredStyle:UIAlertControllerStyleAlert];
            [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
            
            UIViewController *rootVC = [UIApplication sharedApplication].keyWindow.rootViewController;
            while (rootVC.presentedViewController) {
                rootVC = rootVC.presentedViewController;
            }
            [rootVC presentViewController:alert animated:YES completion:nil];
        }

        - (void)showPanel {
            self.hidden = NO;
            self.panelView.transform = CGAffineTransformMakeScale(0.8, 0.8);
            self.panelView.alpha = 0;
            [UIView animateWithDuration:0.25 animations:^{
                self.panelView.transform = CGAffineTransformIdentity;
                self.panelView.alpha = 1.0;
            }];
        }

        - (void)hidePanel {
            [UIView animateWithDuration:0.2 animations:^{
                self.panelView.transform = CGAffineTransformMakeScale(0.8, 0.8);
                self.panelView.alpha = 0;
            } completion:^(BOOL finished) {
                self.hidden = YES;
            }];
        }
        @end
        EOF

    - name: Compile Dylib via Clang on macos-14
      run: |
        mkdir -p build
        clang -dynamiclib -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
              -arch arm64 -miphoneos-version-min=14.0 \
              -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
              -fobjc-arc \
              VladVideoStarTool.mm -o build/VladVideoStarTool.dylib

    - name: Upload Built Dylib Artifact
      uses: actions/upload-artifact@v3
      with:
        name: VladVideoStarTool-Dylib
        path: build/VladVideoStarTool.dylib
