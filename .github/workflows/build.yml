name: Build Vlad Tool Final
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          $THEOS/bin/update-theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Tải SDK
        run: |
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/iPhoneOS14.5.sdk $THEOS/sdks/

      - name: Setup Tools (ldid & dpkg)
        run: |
          brew install ldid dpkg

      - name: Tạo Build Files
        run: |
          cat << 'EOF' > Makefile
          ARCHS = arm64 arm64e
          TARGET = iphone:clang:latest:14.0
          include $(THEOS)/makefiles/common.mk
          LIBRARY_NAME = VladAuto
          VladAuto_FILES = Tweak.mm
          VladAuto_FRAMEWORKS = UIKit Foundation AVFoundation Photos PhotosUI QuartzCore CoreMedia AudioToolbox UniformTypeIdentifiers
          VladAuto_CFLAGS = -fobjc-arc -Wno-everything -std=c++17
          VladAuto_CCFLAGS = -std=c++17
          include $(THEOS_MAKE_PATH)/library.mk
          EOF

          cat << 'TWEAKEOF' > Tweak.mm
          #import <UIKit/UIKit.h>
          #import <AVFoundation/AVFoundation.h>
          #import <Photos/Photos.h>
          #import <PhotosUI/PhotosUI.h>
          #import <QuartzCore/QuartzCore.h>
          #import <objc/runtime.h>
          #import <CoreMedia/CoreMedia.h>
          #import <AudioToolbox/AudioToolbox.h>
          #import <UniformTypeIdentifiers/UniformTypeIdentifiers.h>

          static UIImage *gLastQRImage = nil;
          static UIWindow *gOverlayWindow = nil;
          static UIViewController *gCurrentEditor = nil;
          static NSURL *gCurrentAudioURL = nil;
          static AVPlayer *gCurrentPlayer = nil;
          static NSArray<NSNumber *> *gDetectedBeats = nil;
          static double gDetectedBPM = 0;
          static id gTimeObserver = nil;

          static void searchImageViews(UIView *parent, NSMutableArray *array);
          static void autoFillSmart(UIViewController *editor);
          static void autoSplitEditor(UIViewController *editor, NSArray<NSNumber *> *beats);

          // ==========================================
          // PASSTHROUGH WINDOW (XUYÊN CHẠM)
          // ==========================================
          @interface VSPassthroughWindow : UIWindow
          @end
          @implementation VSPassthroughWindow
          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              UIView *hitView = [super hitTest:point withEvent:event];
              if (hitView == self || hitView == self.rootViewController.view) return nil;
              return hitView;
          }
          @end

          // ==========================================
          // UI THEME
          // ==========================================
          @interface VladUI : NSObject
          + (UIColor *)neonCyan;
          + (UIColor *)neonPurple;
          + (CAGradientLayer *)gradientLayerForBounds:(CGRect)bounds;
          + (UIImage *)iconWithName:(NSString *)name size:(CGFloat)size color:(UIColor *)color;
          @end

          @implementation VladUI
          + (UIColor *)neonCyan { return [UIColor colorWithRed:0.0 green:0.9 blue:0.9 alpha:1.0]; }
          + (UIColor *)neonPurple { return [UIColor colorWithRed:0.6 green:0.2 blue:1.0 alpha:1.0]; }
          + (CAGradientLayer *)gradientLayerForBounds:(CGRect)bounds {
              CAGradientLayer *g = [CAGradientLayer layer];
              g.frame = bounds;
              g.colors = @[(id)[self neonCyan].CGColor, (id)[self neonPurple].CGColor];
              g.startPoint = CGPointMake(0, 0);
              g.endPoint = CGPointMake(1, 1);
              return g;
          }
          + (UIImage *)iconWithName:(NSString *)name size:(CGFloat)size color:(UIColor *)color {
              if (@available(iOS 13.0, *)) {
                  UIImage *img = [UIImage systemImageNamed:name];
                  UIImageSymbolConfiguration *config = [UIImageSymbolConfiguration configurationWithPointSize:size weight:UIImageSymbolWeightBold];
                  img = [img imageWithConfiguration:config];
                  return [img imageWithTintColor:color renderingMode:UIImageRenderingModeAlwaysOriginal];
              }
              return nil;
          }
          @end

          // ==========================================
          // BEAT DETECTOR
          // ==========================================
          @interface BeatDetector : NSObject
          + (void)analyzeURL:(NSURL *)url completion:(void(^)(double bpm, NSArray<NSNumber *> *beats, NSError *error))completion;
          @end

          @implementation BeatDetector
          + (void)analyzeURL:(NSURL *)url completion:(void(^)(double bpm, NSArray<NSNumber *> *beats, NSError *error))completion {
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  NSError *err = nil;
                  NSArray *beats = nil;
                  double bpm = 0;

                  @try {
                      AVURLAsset *asset = [AVURLAsset URLAssetWithURL:url options:nil];
                      AVAssetTrack *track = [asset tracksWithMediaType:AVMediaTypeAudio].firstObject;
                      if (!track) {
                          err = [NSError errorWithDomain:@"Vlad" code:1 userInfo:@{NSLocalizedDescriptionKey:@"File không có âm thanh"}];
                      } else {
                          AVAssetReader *reader = [AVAssetReader assetReaderWithAsset:asset error:&err];
                          if (reader) {
                              NSDictionary *settings = @{
                                  AVFormatIDKey: @(kAudioFormatLinearPCM),
                                  AVLinearPCMBitDepthKey: @16,
                                  AVLinearPCMIsFloatKey: @NO,
                                  AVLinearPCMIsBigEndianKey: @NO,
                                  AVLinearPCMIsNonInterleaved: @NO,
                                  AVSampleRateKey: @22050,
                                  AVNumberOfChannelsKey: @1
                              };
                              AVAssetReaderTrackOutput *out = [[AVAssetReaderTrackOutput alloc] initWithTrack:track outputSettings:settings];
                              out.alwaysCopiesSampleData = NO;
                              [reader addOutput:out];
                              [reader startReading];

                              NSMutableData *allPCM = [NSMutableData data];
                              CMSampleBufferRef sample;
                              while ((sample = [out copyNextSampleBuffer])) {
                                  CMBlockBufferRef block = CMSampleBufferGetDataBuffer(sample);
                                  if (block) {
                                      size_t len = CMBlockBufferGetDataLength(block);
                                      int16_t *buf = (int16_t *)malloc(len);
                                      CMBlockBufferCopyDataBytes(block, 0, len, buf);
                                      [allPCM appendBytes:buf length:len];
                                      free(buf);
                                  }
                                  CFRelease(sample);
                              }
                              [reader cancelReading];

                              NSInteger sampleCount = allPCM.length / sizeof(int16_t);
                              int16_t *samples = (int16_t *)allPCM.bytes;
                              const int hop = 512;
                              NSInteger frames = sampleCount / hop;

                              if (frames < 16) {
                                  err = [NSError errorWithDomain:@"Vlad" code:2 userInfo:@{NSLocalizedDescriptionKey:@"Audio quá ngắn"}];
                              } else {
                                  double *energy = (double *)malloc(frames * sizeof(double));
                                  for (NSInteger i = 0; i < frames; i++) {
                                      double e = 0;
                                      for (int j = 0; j < hop; j++) {
                                          double s = samples[i*hop + j] / 32768.0;
                                          e += s * s;
                                      }
                                      energy[i] = e / hop;
                                  }

                                  double *onset = (double *)malloc(frames * sizeof(double));
                                  for (NSInteger i = 0; i < frames; i++) {
                                      double prev = (i > 0) ? energy[i-1] : energy[0];
                                      double v = energy[i] - prev;
                                      onset[i] = (v > 0) ? v : 0;
                                  }

                                  NSInteger searchMin = 14;
                                  NSInteger searchMax = 86;
                                  if (searchMax >= frames) searchMax = frames - 1;
                                  NSInteger bestLag = 0;
                                  double bestScore = 0;

                                  for (NSInteger lag = searchMin; lag < searchMax; lag++) {
                                      double sum = 0;
                                      for (NSInteger i = 0; i < frames - lag; i++) {
                                          sum += onset[i] * onset[i+lag];
                                      }
                                      sum /= (frames - lag);
                                      if (lag >= 16 && lag <= 32) sum *= 1.2;
                                      if (sum > bestScore) {
                                          bestScore = sum;
                                          bestLag = lag;
                                      }
                                  }

                                  if (bestLag > 0) {
                                      double fps = 22050.0 / hop;
                                      double beatPeriodSec = bestLag / fps;
                                      bpm = 60.0 / beatPeriodSec;

                                      double threshold = 0;
                                      for (NSInteger i = 0; i < frames; i++) threshold += onset[i];
                                      threshold /= frames;
                                      threshold *= 1.4;

                                      NSMutableArray *list = [NSMutableArray array];
                                      for (NSInteger i = 1; i < frames - 1; i++) {
                                          if (onset[i] > threshold && onset[i] > onset[i-1] && onset[i] >= onset[i+1]) {
                                              double t = (double)i * hop / 22050.0;
                                              [list addObject:@(t)];
                                          }
                                      }
                                      beats = list;
                                      if (list.count == 0) {
                                          err = [NSError errorWithDomain:@"Vlad" code:3 userInfo:@{NSLocalizedDescriptionKey:@"Không thấy nhịp"}];
                                      }
                                  } else {
                                      err = [NSError errorWithDomain:@"Vlad" code:4 userInfo:@{NSLocalizedDescriptionKey:@"Không tìm thấy tempo"}];
                                  }

                                  free(energy);
                                  free(onset);
                              }
                          }
                      }
                  } @catch (NSException *e) {
                      err = [NSError errorWithDomain:@"Vlad" code:99 userInfo:@{NSLocalizedDescriptionKey: e.reason ?: @"Lỗi phân tích"}];
                  }

                  dispatch_async(dispatch_get_main_queue(), ^{
                      completion(bpm, beats, err);
                  });
              });
          }
          @end

          // ==========================================
          // MENU VIEW (TỐI GIẢN, BO GÓC MỀM)
          // ==========================================
          @interface VladMenuView : UIView <PHPickerViewControllerDelegate, UIDocumentPickerDelegate>
          @property (nonatomic, strong) UIView *panel;
          @property (nonatomic, strong) NSMutableArray<UIButton *> *tabButtons;
          @property (nonatomic, strong) UIView *contentView;
          - (void)setupUI;
          - (void)tabTapped:(UIButton *)sender;
          - (void)renderTab:(NSInteger)index;
          - (void)funcTapped:(UIButton *)sender;
          - (void)showAlert:(NSString *)title msg:(NSString *)msg;
          - (void)startHapticSync;
          - (void)analyzeAudio:(NSURL *)url;
          - (void)pickAudioFile;
          - (void)closeTapped;
          @end

          @implementation VladMenuView
          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (self) [self setupUI];
              return self;
          }
          - (void)setupUI {
              self.backgroundColor = [UIColor colorWithWhite:0 alpha:0.6];
              
              CGFloat width = 310, height = 440;
              self.panel = [[UIView alloc] initWithFrame:CGRectMake(0, 0, width, height)];
              self.panel.center = self.center;
              self.panel.backgroundColor = [UIColor colorWithRed:0.08 green:0.08 blue:0.1 alpha:0.95];
              self.panel.layer.cornerRadius = 20;
              self.panel.layer.borderWidth = 1.5;
              self.panel.layer.borderColor = [VladUI neonCyan].CGColor;
              self.panel.layer.shadowColor = [VladUI neonCyan].CGColor;
              self.panel.layer.shadowRadius = 15;
              self.panel.layer.shadowOpacity = 0.4;
              self.panel.layer.shadowOffset = CGSizeZero;
              [self addSubview:self.panel];

              // Header
              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(20, 20, width-40, 28)];
              title.text = @"VLAD LIMITED";
              title.textColor = [UIColor whiteColor];
              title.font = [UIFont fontWithName:@"HelveticaNeue-Bold" size:20];
              [self.panel addSubview:title];

              UILabel *subtitle = [[UILabel alloc] initWithFrame:CGRectMake(20, 46, width-40, 18)];
              subtitle.text = @"Sống Bằng Tình Cảm 5.0";
              subtitle.textColor = [VladUI neonCyan];
              subtitle.font = [UIFont systemFontOfSize:11 weight:UIFontWeightMedium];
              [self.panel addSubview:subtitle];

              UIButton *close = [UIButton buttonWithType:UIButtonTypeCustom];
              close.frame = CGRectMake(width - 44, 20, 30, 30);
              [close setImage:[VladUI iconWithName:@"xmark.circle.fill" size:22 color:[UIColor grayColor]] forState:UIControlStateNormal];
              [close addTarget:self action:@selector(closeTapped) forControlEvents:UIControlEventTouchUpInside];
              [self.panel addSubview:close];

              // Tabs
              UIView *tabBar = [[UIView alloc] initWithFrame:CGRectMake(20, 80, width-40, 36)];
              tabBar.backgroundColor = [UIColor colorWithWhite:1 alpha:0.05];
              tabBar.layer.cornerRadius = 10;
              [self.panel addSubview:tabBar];

              NSArray *titles = @[@"TRANG CHỦ", @"CHỨC NĂNG", @"TÁC GIẢ"];
              self.tabButtons = [NSMutableArray array];
              for (int i=0; i<3; i++) {
                  UIButton *btn = [UIButton buttonWithType:UIButtonTypeCustom];
                  btn.frame = CGRectMake(i * (width-40)/3.0, 0, (width-40)/3.0, 36);
                  [btn setTitle:titles[i] forState:UIControlStateNormal];
                  [btn setTitleColor:[UIColor grayColor] forState:UIControlStateNormal];
                  [btn setTitleColor:[UIColor blackColor] forState:UIControlStateSelected];
                  btn.titleLabel.font = [UIFont boldSystemFontOfSize:10];
                  btn.tag = i;
                  btn.layer.cornerRadius = 10;
                  [btn addTarget:self action:@selector(tabTapped:) forControlEvents:UIControlEventTouchUpInside];
                  [tabBar addSubview:btn];
                  [self.tabButtons addObject:btn];
              }

              self.contentView = [[UIView alloc] initWithFrame:CGRectMake(20, 130, width-40, 290)];
              [self.panel addSubview:self.contentView];

              [self tabTapped:self.tabButtons[0]];
          }

          - (void)tabTapped:(UIButton *)sender {
              for (UIButton *b in self.tabButtons) {
                  b.selected = NO;
                  // Fix crash: copy array before enumerating
                  NSArray *sublayers = [b.layer.sublayers copy];
                  for (CALayer *layer in sublayers) {
                      if ([layer isKindOfClass:[CAGradientLayer class]]) [layer removeFromSuperlayer];
                  }
                  [b setTitleColor:[UIColor grayColor] forState:UIControlStateNormal];
              }
              sender.selected = YES;
              
              CAGradientLayer *grad = [VladUI gradientLayerForBounds:sender.bounds];
              grad.cornerRadius = 10;
              [sender.layer insertSublayer:grad atIndex:0];
              [sender setTitleColor:[UIColor blackColor] forState:UIControlStateSelected];

              [self renderTab:sender.tag];
          }

          - (void)renderTab:(NSInteger)index {
              for (UIView *v in self.contentView.subviews) [v removeFromSuperview];
              
              if (index == 0) {
                  UILabel *lbl = [[UILabel alloc] initWithFrame:self.contentView.bounds];
                  lbl.numberOfLines = 0;
                  lbl.textColor = [UIColor lightGrayColor];
                  lbl.font = [UIFont systemFontOfSize:13];
                  lbl.textAlignment = NSTextAlignmentCenter;
                  lbl.text = @"Chào mừng He đến với Vlad Limited.\n\nCông cụ hỗ trợ edit Video Star tối ưu & thông minh nhất.\n\nVui lòng chuyển sang tab CHỨC NĂNG để bắt đầu trải nghiệm.";
                  [self.contentView addSubview:lbl];
              }
              else if (index == 1) {
                  NSArray *titles = @[@"Xem Code Gần Nhất", @"Auto Nhập Hình Ảnh", @"Auto Chia Beat Nhạc"];
                  NSArray *icons = @[@"qrcode.viewfinder", @"photo.on.rectangle.angled", @"waveform.path.ecg"];
                  
                  for (int i=0; i<3; i++) {
                      UIButton *btn = [UIButton buttonWithType:UIButtonTypeCustom];
                      btn.frame = CGRectMake(0, i*90, self.contentView.bounds.size.width, 75);
                      btn.backgroundColor = [UIColor colorWithWhite:1 alpha:0.05];
                      btn.layer.cornerRadius = 12;
                      btn.layer.borderWidth = 1.0;
                      btn.layer.borderColor = [[VladUI neonCyan] colorWithAlphaComponent:0.3].CGColor;
                      btn.tag = i;
                      
                      UIImageView *iconView = [[UIImageView alloc] initWithFrame:CGRectMake(16, 25, 24, 24)];
                      iconView.image = [VladUI iconWithName:icons[i] size:22 color:[VladUI neonCyan]];
                      iconView.contentMode = UIViewContentModeScaleAspectFit;
                      [btn addSubview:iconView];
                      
                      UILabel *titleLbl = [[UILabel alloc] initWithFrame:CGRectMake(52, 25, btn.bounds.size.width-60, 24)];
                      titleLbl.text = titles[i];
                      titleLbl.textColor = [UIColor whiteColor];
                      titleLbl.font = [UIFont boldSystemFontOfSize:14];
                      [btn addSubview:titleLbl];
                      
                      [btn addTarget:self action:@selector(funcTapped:) forControlEvents:UIControlEventTouchUpInside];
                      [self.contentView addSubview:btn];
                  }
              }
              else {
                  UILabel *lbl = [[UILabel alloc] initWithFrame:self.contentView.bounds];
                  lbl.numberOfLines = 0;
                  lbl.textColor = [VladUI neonPurple];
                  lbl.textAlignment = NSTextAlignmentCenter;
                  lbl.font = [UIFont systemFontOfSize:13 weight:UIFontWeightMedium];
                  lbl.text = @"Chủ sở hữu: Vlad\nNgười sáng tạo: Vlad\n\nLƯU Ý:\nNghiêm cấm trộm code, leak tool dưới mọi hình thức!";
                  [self.contentView addSubview:lbl];
              }
          }

          - (void)funcTapped:(UIButton *)sender {
              if (sender.tag == 0) {
                  if (gLastQRImage) {
                      UIView *blurView = [[UIView alloc] initWithFrame:self.bounds];
                      blurView.backgroundColor = [UIColor colorWithWhite:0 alpha:0.95];
                      blurView.tag = 999;
                      
                      UIImageView *iv = [[UIImageView alloc] initWithImage:gLastQRImage];
                      iv.frame = CGRectInset(blurView.bounds, 30, 100);
                      iv.contentMode = UIViewContentModeScaleAspectFit;
                      iv.layer.cornerRadius = 12;
                      iv.clipsToBounds = YES;
                      [blurView addSubview:iv];
                      
                      UIButton *close = [UIButton buttonWithType:UIButtonTypeCustom];
                      close.frame = CGRectMake(blurView.bounds.size.width/2 - 50, blurView.bounds.size.height - 80, 100, 44);
                      [close setTitle:@"ĐÓNG" forState:UIControlStateNormal];
                      [close setTitleColor:[UIColor blackColor] forState:UIControlStateNormal];
                      close.backgroundColor = [VladUI neonCyan];
                      close.layer.cornerRadius = 22;
                      close.titleLabel.font = [UIFont boldSystemFontOfSize:15];
                      [close addTarget:self action:@selector(closeBlur:) forControlEvents:UIControlEventTouchUpInside];
                      [blurView addSubview:close];
                      
                      [self addSubview:blurView];
                  } else {
                      [self showAlert:@"Thông báo" msg:@"Chưa có ảnh Code nào được lưu. Hãy chọn ảnh trong Video Star trước."];
                  }
              } else if (sender.tag == 1) {
                  PHPickerConfiguration *config = [[PHPickerConfiguration alloc] init];
                  config.filter = [PHPickerFilter imagesFilter];
                  config.selectionLimit = 1;
                  PHPickerViewController *picker = [[PHPickerViewController alloc] initWithConfiguration:config];
                  picker.delegate = self;
                  
                  UIWindow *keyWin = nil;
                  for (UIWindow *w in [UIApplication sharedApplication].windows) {
                      if (!w.hidden && w.rootViewController && w != gOverlayWindow) { keyWin = w; break; }
                  }
                  [keyWin.rootViewController presentViewController:picker animated:YES completion:nil];
              } else if (sender.tag == 2) {
                  if (gCurrentAudioURL) {
                      [self analyzeAudio:gCurrentAudioURL];
                  } else {
                      [self pickAudioFile];
                  }
              }
          }

          - (void)closeBlur:(UIButton *)btn { [btn.superview removeFromSuperview]; }

          - (void)pickAudioFile {
              UIDocumentPickerViewController *picker = [[UIDocumentPickerViewController alloc] initForOpeningContentTypes:@[UTTypeAudio]];
              picker.delegate = self;
              UIWindow *keyWin = nil;
              for (UIWindow *w in [UIApplication sharedApplication].windows) {
                  if (!w.hidden && w.rootViewController && w != gOverlayWindow) { keyWin = w; break; }
              }
              [keyWin.rootViewController presentViewController:picker animated:YES completion:nil];
          }

          - (void)documentPicker:(UIDocumentPickerViewController *)controller didPickDocumentsAtURLs:(NSArray<NSURL *> *)urls {
              if (urls.count > 0) {
                  [self analyzeAudio:urls.firstObject];
              }
          }

          - (void)analyzeAudio:(NSURL *)url {
              [self showAlert:@"Đang phân tích" msg:@"Đợi xíu nhé, đang bắt nhịp..."];
              [BeatDetector analyzeURL:url completion:^(double bpm, NSArray<NSNumber *> *beats, NSError *error) {
                  if (error) {
                      [self showAlert:@"Lỗi" msg:error.localizedDescription];
                  } else {
                      gDetectedBPM = bpm;
                      gDetectedBeats = beats;
                      gCurrentPlayer = [[AVPlayer alloc] initWithURL:url];
                      
                      NSString *msg = [NSString stringWithFormat:@"BPM: %.1f\nSố Beat: %lu\n\nĐã tự động chia phân cảnh trên timeline theo nhịp bài hát!", bpm, (unsigned long)beats.count];
                      [self showAlert:@"Chia Beat Thành Công" msg:msg];
                      
                      autoSplitEditor(gCurrentEditor, beats);
                      [self startHapticSync];
                  }
              }];
          }

          - (void)picker:(PHPickerViewController *)picker didFinishPicking:(NSArray<PHPickerResult *> *)results {
              [picker dismissViewControllerAnimated:YES completion:nil];
              if (results.count > 0) {
                  NSItemProvider *provider = results.firstObject.itemProvider;
                  if ([provider canLoadObjectOfClass:[UIImage class]]) {
                      [provider loadObjectOfClass:[UIImage class] completionHandler:^(id<NSItemProviderReading> _Nullable image, NSError * _Nullable error) {
                          if (image) {
                              gLastQRImage = (UIImage *)image;
                              dispatch_async(dispatch_get_main_queue(), ^{
                                  autoFillSmart(gCurrentEditor);
                                  [self showAlert:@"Thành công" msg:@"Đã tự động nhập ảnh vào tất cả lớp hình ảnh!"];
                              });
                          }
                      }];
                  }
              }
          }

          - (void)startHapticSync {
              if (!gCurrentPlayer || !gDetectedBeats) return;
              if (gTimeObserver) {
                  [gCurrentPlayer removeTimeObserver:gTimeObserver];
                  gTimeObserver = nil;
              }
              [gCurrentPlayer play];
              NSArray *beats = gDetectedBeats;
              __block NSInteger lastIdx = -1;
              gTimeObserver = [gCurrentPlayer addPeriodicTimeObserverForInterval:CMTimeMake(1, 30) queue:dispatch_get_main_queue() usingBlock:^(CMTime time) {
                  double t = CMTimeGetSeconds(time);
                  for (NSInteger i = 0; i < (NSInteger)beats.count; i++) {
                      double bt = [beats[i] doubleValue];
                      if (bt > t - 0.05 && bt <= t + 0.05 && i != lastIdx) {
                          lastIdx = i;
                          UIImpactFeedbackGenerator *gen = [[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleMedium];
                          [gen prepare];
                          [gen impactOccurred];
                          break;
                      }
                  }
              }];
          }

          - (void)showAlert:(NSString *)title msg:(NSString *)msg {
              UIAlertController *al = [UIAlertController alertControllerWithTitle:title message:msg preferredStyle:UIAlertControllerStyleAlert];
              [al addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
              UIWindow *win = nil;
              for (UIWindow *w in [UIApplication sharedApplication].windows) {
                  if (!w.hidden && w.rootViewController && w != gOverlayWindow) { win = w; break; }
              }
              [win.rootViewController presentViewController:al animated:YES completion:nil];
          }
          
          - (void)closeTapped { [self removeFromSuperview]; }
          @end

          // ==========================================
          // LOGO OVERLAY
          // ==========================================
          @interface VladLogoView : UIView
          - (void)logoTapped;
          - (void)logoPanned:(UIPanGestureRecognizer *)pan;
          @end
          @implementation VladLogoView
          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (self) {
                  self.backgroundColor = [UIColor colorWithWhite:0.05 alpha:0.9];
                  self.layer.cornerRadius = frame.size.width / 2;
                  self.layer.borderWidth = 1.5;
                  self.layer.borderColor = [VladUI neonCyan].CGColor;
                  self.layer.shadowColor = [VladUI neonCyan].CGColor;
                  self.layer.shadowRadius = 8;
                  self.layer.shadowOpacity = 1.0;
                  self.layer.shadowOffset = CGSizeZero;
                  
                  UILabel *lbl = [[UILabel alloc] initWithFrame:self.bounds];
                  lbl.text = @"V";
                  lbl.textColor = [UIColor whiteColor];
                  lbl.textAlignment = NSTextAlignmentCenter;
                  lbl.font = [UIFont fontWithName:@"HelveticaNeue-Bold" size:28];
                  [self addSubview:lbl];
                  
                  UITapGestureRecognizer *tap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(logoTapped)];
                  [self addGestureRecognizer:tap];
                  UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(logoPanned:)];
                  [self addGestureRecognizer:pan];
              }
              return self;
          }
          - (void)logoTapped {
              UIWindow *win = [UIApplication sharedApplication].keyWindow;
              for (UIView *v in win.subviews) { if ([v isKindOfClass:[VladMenuView class]]) return; }
              VladMenuView *menu = [[VladMenuView alloc] initWithFrame:win.bounds];
              [win addSubview:menu];
          }
          - (void)logoPanned:(UIPanGestureRecognizer *)pan {
              CGPoint translation = [pan translationInView:self.superview];
              self.center = CGPointMake(self.center.x + translation.x, self.center.y + translation.y);
              [pan setTranslation:CGPointZero inView:self.superview];
          }
          @end

          // ==========================================
          // HOOKS & SWIZZLING
          // ==========================================
          @interface UIViewController (VladHook)
          - (void)vlad_viewDidLoad;
          @end
          @implementation UIViewController (VladHook)
          - (void)vlad_viewDidLoad {
              [self vlad_viewDidLoad];
              NSString *cls = NSStringFromClass([self class]);
              if ([cls containsString:@"MultiLayerWizEffectVC"] || [cls containsString:@"Editor"]) {
                  gCurrentEditor = self;
              }
          }
          @end

          @interface AVPlayer (VladHook)
          - (void)vlad_play;
          @end
          @implementation AVPlayer (VladHook)
          - (void)vlad_play {
              [self vlad_play];
              gCurrentPlayer = self;
              AVPlayerItem *item = self.currentItem;
              if (item && [item.asset isKindOfClass:[AVURLAsset class]]) {
                  gCurrentAudioURL = ((AVURLAsset *)item.asset).URL;
              }
          }
          @end

          // ==========================================
          // XỬ LÝ CHỨC NĂNG
          // ==========================================
          static void autoFillSmart(UIViewController *editor) {
              if (!editor || !gLastQRImage) return;
              @try {
                  NSMutableArray *imageViews = [NSMutableArray array];
                  searchImageViews(editor.view, imageViews);
                  for (UIImageView *iv in imageViews) {
                      // Chỉ nhập vào lớp có hình ảnh, kích thước > 50x50. Bỏ qua lớp trống, icon nhỏ.
                      if (iv.image != nil && iv.bounds.size.width > 50 && iv.bounds.size.height > 50) {
                          iv.image = gLastQRImage;
                      }
                  }
              } @catch (NSException *e) {}
          }

          static void searchImageViews(UIView *parent, NSMutableArray *array) {
              for (UIView *sub in parent.subviews) {
                  if ([sub isKindOfClass:[UIImageView class]]) [array addObject:sub];
                  searchImageViews(sub, array);
              }
          }

          static void autoSplitEditor(UIViewController *editor, NSArray<NSNumber *> *beats) {
              if (!editor || beats.count == 0) return;
              @try {
                  unsigned int count;
                  Method *methods = class_copyMethodList([editor class], &count);
                  SEL splitSel = NULL;
                  for (int i = 0; i < count; i++) {
                      NSString *selName = NSStringFromSelector(method_getName(methods[i])).lowercaseString;
                      if ([selName containsString:@"split"] || [selName containsString:@"divide"] || [selName containsString:@"cut"]) {
                          splitSel = method_getName(methods[i]);
                          break;
                      }
                  }
                  free(methods);
                  
                  if (splitSel) {
                      NSMethodSignature *sig = [editor methodSignatureForSelector:splitSel];
                      if (sig && sig.numberOfArguments > 2) {
                          NSInvocation *inv = [NSInvocation invocationWithMethodSignature:sig];
                          [inv setTarget:editor];
                          [inv setSelector:splitSel];
                          for (NSNumber *beat in beats) {
                              double t = [beat doubleValue];
                              [inv setArgument:&t atIndex:2];
                              [inv invoke];
                          }
                      }
                  }
              } @catch (NSException *e) {}
          }

          __attribute__((constructor))
          static void initVlad() {
              @autoreleasepool {
                  Method orig2 = class_getInstanceMethod([UIViewController class], @selector(viewDidLoad));
                  Method new2 = class_getInstanceMethod([UIViewController class], @selector(vlad_viewDidLoad));
                  if (orig2 && new2) method_exchangeImplementations(orig2, new2);

                  Method orig3 = class_getInstanceMethod([AVPlayer class], @selector(play));
                  Method new3 = class_getInstanceMethod([AVPlayer class], @selector(vlad_play));
                  if (orig3 && new3) method_exchangeImplementations(orig3, new3);

                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      if (!gOverlayWindow) {
                          gOverlayWindow = [[VSPassthroughWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                          gOverlayWindow.windowLevel = UIWindowLevelAlert + 10;
                          gOverlayWindow.backgroundColor = [UIColor clearColor];
                          gOverlayWindow.rootViewController = [[UIViewController alloc] init];
                          gOverlayWindow.rootViewController.view.backgroundColor = [UIColor clearColor];
                          gOverlayWindow.hidden = NO;
                          
                          VladLogoView *logo = [[VladLogoView alloc] initWithFrame:CGRectMake([UIScreen mainScreen].bounds.size.width - 66, 120, 50, 50)];
                          [gOverlayWindow.rootViewController.view addSubview:logo];
                      }
                  });
              }
          }
          TWEAKEOF

      - name: Build
        run: |
          set -o pipefail
          make clean || true
          make -j1 VERBOSE=1 2>&1 | tee build.log
          
          echo "=== Xử lý Dylib ==="
          DYLIB_PATH=$(find .theos/obj -name "VladAuto.dylib" -type f | head -n 1)
          echo "Tìm thấy: $DYLIB_PATH"
          
          mkdir -p output
          cp "$DYLIB_PATH" output/vlad.dylib
          
          install_name_tool -id "@rpath/vlad.dylib" output/vlad.dylib
          ldid -S output/vlad.dylib
          
          echo "=== build xong ==="

      - name: Upload Vlad Dylib
        uses: actions/upload-artifact@v4
        with:
          name: vlad.dylib
          path: output/vlad.dylib
          if-no-files-found: error
